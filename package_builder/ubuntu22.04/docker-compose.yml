services:
  deb:
    build:
      context: .
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        ICECREAM_BUILDER_INSECURE: ${ICECREAM_BUILDER_INSECURE:-}
    environment:
      - http_proxy
      - https_proxy
      - no_proxy
      - HTTP_PROXY
      - HTTPS_PROXY
      - NO_PROXY
      - ICECREAM_BUILDER_INSECURE
      - RELEASE_TARBALL
      - ICEFARM_TMPDIR=/scratch
    volumes:
      - ../..:/src:ro
      - ./out:/out
      - ${ICEFARM_TMPDIR:?set ICEFARM_TMPDIR to existing scratch}:/scratch
    working_dir: /work
    command: ["sh", "/src/dev/python.sh", "--exec", "/usr/local/bin/build_deb.sh"]
  verify:
    build:
      context: .
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        ICECREAM_BUILDER_INSECURE: ${ICECREAM_BUILDER_INSECURE:-}
    environment:
      - http_proxy
      - https_proxy
      - no_proxy
      - HTTP_PROXY
      - HTTPS_PROXY
      - NO_PROXY
      - ICECREAM_BUILDER_INSECURE
      - RELEASE_TARBALL
      - ICEFARM_TMPDIR=/scratch
    volumes:
      - ../..:/src:ro
      - ./out:/out
      - ${ICEFARM_TMPDIR:?set ICEFARM_TMPDIR to existing scratch}:/scratch
    working_dir: /work
    command: ["sh", "/src/dev/python.sh", "--exec", "/usr/local/bin/verify_deb.sh"]
