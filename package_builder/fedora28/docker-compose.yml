services:
  rpm:
    build:
      context: .
    volumes:
      - ../..:/src:ro
      - ./out:/out
    working_dir: /work
    command: ["/usr/local/bin/build_rpm.sh"]
  verify:
    build:
      context: .
    volumes:
      - ../..:/src:ro
      - ./out:/out
    working_dir: /work
    command: ["/usr/local/bin/verify_rpm.sh"]
