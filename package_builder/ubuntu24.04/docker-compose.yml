services:
  deb:
    build:
      context: .
    volumes:
      - ../..:/src:ro
      - ./out:/out
    working_dir: /work
    command: ["/usr/local/bin/build_deb.sh"]
  verify:
    build:
      context: .
    volumes:
      - ../..:/src:ro
      - ./out:/out
    working_dir: /work
    command: ["/usr/local/bin/verify_deb.sh"]

