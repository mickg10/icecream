SPECIFICATION Spec

CONSTANTS
    Assignments = {a0, a1}
    Epochs = {e0, e1}
    WireIds = {w0}
    Nonces = {n0, n1}
    NoAssignment = no_assignment
    NoEpoch = no_epoch
    InitEpoch = e0
    RestartAssignment = a1
    A0 = a0
    A1 = a1
    E0 = e0
    E1 = e1
    W0 = w0
    N0 = n0
    N1 = n1
    EpochOf <- EpochOfDef
    WireOf <- WireOfDef
    NonceOf <- NonceOfDef
    AssignmentAt <- AssignmentAtDef
    MutantAllowStrictLegacy = FALSE
    MutantPublishBeforeReady = FALSE
    MutantPublishAfterRevoke = FALSE
    MutantReleaseWithoutRevoke = FALSE
    MutantPrepareOverTombstone = FALSE
    MutantReuseEpochAfterLoss = TRUE

INVARIANTS
    TypeOK
    SameEpochRevocationSafety
    StrictRevocationSafety

CHECK_DEADLOCK FALSE
