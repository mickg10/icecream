name: assignment-fence-launcher-static-fix-once

on:
  push:
    branches:
      - bigoracle/assignment-fence-proof-v4
    paths:
      - ".github/workflows/assignment-fence-launcher-static-fix-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bigoracle/assignment-fence-proof-v4
          fetch-depth: 0
      - name: Bind launcher to exact domain static contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('formal/run_assignment_fence_focused_gate.py')
          text = path.read_text(encoding='utf-8')
          marker = 'ASSIGNMENT_FENCE_DOMAIN_STATIC_V1'
          if marker not in text:
              constants_anchor = 'RUNNER = HERE / "run_formal_checks_v4.py"\n'
              constants = '''RUNNER = HERE / "run_formal_checks_v4.py"\nCHECKER = HERE / "assignment_fence_static_check.py"\nAUTHORITATIVE_MANIFEST = HERE / "assignment-fence-proof-checks-v1.json"\n# ASSIGNMENT_FENCE_DOMAIN_STATIC_V1\n'''
              if text.count(constants_anchor) != 1:
                  raise SystemExit('launcher constants anchor changed')
              text = text.replace(constants_anchor, constants)

              main_anchor = '''    args = parser().parse_args()\n    repo = args.repo.resolve()\n    help_process = subprocess.run(\n'''
              main_replacement = '''    args = parser().parse_args()\n    repo = args.repo.resolve()\n    manifest = args.manifest.resolve()\n    artifacts = args.artifacts.resolve()\n    if manifest != AUTHORITATIVE_MANIFEST.resolve():\n        raise SystemExit(\n            f"only {AUTHORITATIVE_MANIFEST.resolve()} is authoritative"\n        )\n    try:\n        artifacts.relative_to(repo)\n    except ValueError:\n        pass\n    else:\n        raise SystemExit("artifact directory must be outside the checkout")\n    static = subprocess.run(\n        [\n            sys.executable,\n            str(CHECKER),\n            "--manifest",\n            str(manifest),\n            "--repo",\n            str(repo),\n            "--formal-dir",\n            "formal",\n        ],\n        cwd=repo,\n        text=True,\n        stdout=subprocess.PIPE,\n        stderr=subprocess.STDOUT,\n    )\n    print(static.stdout, end="")\n    if static.returncode != 0:\n        return static.returncode\n\n    help_process = subprocess.run(\n'''
              if text.count(main_anchor) != 1:
                  raise SystemExit('launcher main anchor changed')
              text = text.replace(main_anchor, main_replacement)
              text = text.replace('str(args.manifest)', 'str(manifest)')
              text = text.replace('str(args.artifacts)', 'str(artifacts)')

              option_anchor = '''    if "--only" in available and os.environ.get("ASSIGNMENT_FENCE_ONLY"):\n'''
              option_insertion = '''    checker_option = add_first_supported(\n        command,\n        available,\n        (\n            "--static-checker",\n            "--static-checker-path",\n            "--checker",\n            "--checker-path",\n            "--static-checker-script",\n        ),\n        str(CHECKER.resolve()),\n    )\n    if checker_option:\n        supplied.add(checker_option)\n    chosen = add_first_supported(\n        command,\n        available,\n        ("--static-checker-sha256", "--checker-sha256", "--static-checker-hash"),\n        sha256(CHECKER.resolve()),\n    )\n    if chosen:\n        supplied.add(chosen)\n    chosen = add_first_supported(\n        command,\n        available,\n        ("--manifest-sha256", "--manifest-hash"),\n        sha256(manifest),\n    )\n    if chosen:\n        supplied.add(chosen)\n    for checker_argument_option in (\n        "--static-checker-arg",\n        "--checker-arg",\n        "--static-arg",\n    ):\n        if checker_argument_option in available:\n            for argument in (\n                "--manifest", str(manifest),\n                "--repo", str(repo),\n                "--formal-dir", "formal",\n            ):\n                command.extend([checker_argument_option, argument])\n            supplied.add(checker_argument_option)\n            break\n    chosen = add_first_supported(\n        command,\n        available,\n        ("--domain", "--domain-name", "--suite-name"),\n        "assignment-fence",\n    )\n    if chosen:\n        supplied.add(chosen)\n    chosen = add_first_supported(\n        command,\n        available,\n        ("--expected-check-count", "--check-count"),\n        "24",\n    )\n    if chosen:\n        supplied.add(chosen)\n\n'''
              if text.count(option_anchor) != 1:
                  raise SystemExit('launcher checker-option anchor changed')
              text = text.replace(option_anchor, option_insertion + option_anchor)

              old_filter = '''        if any(token in option for token in ("tlapm", "tlaps", "backend", "proof"))\n'''
              new_filter = '''        if any(\n            token in option\n            for token in (\n                "tlapm", "tlaps", "backend", "proof",\n                "static", "checker", "manifest", "domain",\n            )\n        )\n'''
              if text.count(old_filter) != 1:
                  raise SystemExit('launcher required-option filter changed')
              text = text.replace(old_filter, new_filter)
          path.write_text(text, encoding='utf-8')
          PY
          python3 formal/run_assignment_fence_focused_gate.py --help
          python3 formal/assignment_fence_static_check_test.py
          git diff --check
      - name: Commit checker binding and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/assignment-fence-launcher-static-fix-once.yml
          git config user.name "mickg10 formal automation"
          git config user.email "5094033+mickg10@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "formal: bind focused runner to exact 24-row static gate"
          git push origin HEAD:bigoracle/assignment-fence-proof-v4
