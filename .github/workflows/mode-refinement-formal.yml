name: mode-refinement-formal

on:
  pull_request:
    paths:
      - "formal/AssignmentFenceModeRefinement.tla"
      - "formal/ModeRefinement*.cfg"
      - "formal/mode-refinement-checks-v1.json"
      - "formal/mode_refinement_static_check.py"
      - "formal/mode_refinement_static_check_test.py"
      - "formal/run_mode_refinement_checks.py"
      - "formal/run_mode_refinement_checks_test.py"
      - "formal/trace-manifests/ModeRefinement*.json"
      - "formal/run_tlc_only_checks_v4.py"
      - ".github/workflows/mode-refinement-formal.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: mode-refinement-formal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  TLC_174_SHA256: "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"
  TLC_180_SHA256: "e22f8ffb4bacdea0a871f444dd94fe5fb0d8013b3388ae39e82e26f852c735d5"

jobs:
  refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact refinement static and runner preflight
        run: |
          set -euo pipefail
          python3 formal/mode_refinement_static_check.py \
            --manifest formal/mode-refinement-checks-v1.json \
            --repo . \
            --formal-dir formal
          python3 formal/mode_refinement_static_check_test.py
          python3 formal/run_mode_refinement_checks_test.py
          python3 formal/trace_to_harness_test.py
          python3 formal/tlc_text_trace_test.py
          python3 formal/normalize_tlc_trace_test.py
          python3 formal/run_tlc_only_checks_v4_test.py
          python3 formal/run_mode_refinement_checks.py --help
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Install Java and execution tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless time curl
      - name: Download and verify both pinned TLC distributions
        run: |
          set -euo pipefail
          root=/tmp/mode-refinement-formal
          mkdir -p "$root"
          curl --fail --location --retry 4 --retry-all-errors \
            -o /tmp/tla2tools-1.7.4.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          curl --fail --location --retry 4 --retry-all-errors \
            -o /tmp/tla2tools-1.8.0.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          printf '%s  %s\n' "$TLC_174_SHA256" /tmp/tla2tools-1.7.4.jar | sha256sum -c -
          printf '%s  %s\n' "$TLC_180_SHA256" /tmp/tla2tools-1.8.0.jar | sha256sum -c -
          sha256sum /tmp/tla2tools-1.7.4.jar /tmp/tla2tools-1.8.0.jar \
            > "$root/tlc-digests.txt"
          java -version > "$root/java-version.txt" 2>&1
      - name: Execute exact generation-4 refinement matrix
        run: |
          set -euo pipefail
          root=/tmp/mode-refinement-formal
          artifacts="$root/artifacts"
          command=(
            python3 formal/run_mode_refinement_checks.py
            --repo .
            --manifest formal/mode-refinement-checks-v1.json
            --artifacts "$artifacts"
            --expected-git-sha "$(git rev-parse HEAD)"
            --stable-jar /tmp/tla2tools-1.7.4.jar
            --stable-sha256 "$TLC_174_SHA256"
            --differential-jar /tmp/tla2tools-1.8.0.jar
            --differential-sha256 "$TLC_180_SHA256"
          )
          printf '%q ' "${command[@]}" > "$root/command.txt"
          printf '\n' >> "$root/command.txt"
          set +e
          /usr/bin/time -v -o "$root/time.txt" \
            "${command[@]}" > "$root/runner.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$root/exit.txt"
          cat "$root/runner.log"
          cat "$root/time.txt"
          test "$rc" -eq 0
      - name: Archive complete refinement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode-refinement-formal-${{ github.sha }}
          path: /tmp/mode-refinement-formal
          if-no-files-found: error
          retention-days: 30
      - name: Publish exact refinement verdict
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, subprocess
          from pathlib import Path

          marker = '<!-- mode-refinement-formal-status -->'
          root = Path('/tmp/mode-refinement-formal')
          exit_path = root / 'exit.txt'
          rc = exit_path.read_text().strip() if exit_path.exists() else 'not-started'
          log_path = root / 'runner.log'
          if log_path.exists():
              lines = log_path.read_text(encoding='utf-8', errors='replace').splitlines()
              selected = [
                  line for line in lines
                  if any(token in line.lower() for token in (
                      'formal acceptance failed', 'failed', 'error:',
                      'states generated', 'distinct states', 'comparison',
                      'trace', 'peak rss', 'mode refinement runner command'
                  ))
              ]
              excerpt = '\n'.join(selected[:190]) or '\n'.join(lines[-150:])
          else:
              excerpt = 'The generation-4 refinement runner did not start.'

          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['GITHUB_RUN_ID']
          def gh(arguments, payload=None):
              return subprocess.run(
                  ['gh', 'api', *arguments],
                  input=payload,
                  text=True,
                  stdout=subprocess.PIPE,
                  check=True,
                  env=os.environ,
              ).stdout
          artifact_document = json.loads(
              gh(['--method','GET',f'repos/{repo}/actions/runs/{run_id}/artifacts','-f','per_page=100'])
          )
          artifact_lines = [
              f"- `{item['name']}` — id `{item['id']}`, digest `{item.get('digest') or 'unavailable'}`"
              for item in artifact_document.get('artifacts', [])
              if item.get('name','').startswith('mode-refinement-formal-')
          ] or ['- NONE']

          verdict = 'GREEN' if rc == '0' else 'RED'
          body = '\n'.join([
              marker,
              'From: mickg10/bigoracle',
              'To: mickg10/local-oracle, mickg10/implementer',
              '',
              '## Strict/pipelined concrete-to-abstract refinement gate',
              '',
              f"- exact head: `{os.environ['GITHUB_SHA']}`",
              f"- workflow run: `{run_id}`",
              f"- generation-4 runner exit: `{rc}`",
              f"- verdict: **{verdict}**",
              '',
              '### Retained artifact',
              '',
              *artifact_lines,
              '',
              '```text', excerpt[:11000], '```',
              '',
              'GREEN means both strict and pipelined fixed refinements passed on TLC 1.7.4 and 1.8.0; the pending-claim stutter and revoke witnesses validated; premature authorization, start-before-grant, dropped-revoke, and overflow mutants validated; the narrowly fair pending-resolution theorem passed; semantic comparisons agreed; and positive resource evidence was retained. This is formal refinement evidence only, not product or performance acceptance.'
          ])
          pages = json.loads(gh(['--paginate','--slurp','--method','GET',f'repos/{repo}/issues/4/comments','-f','per_page=100']))
          comments = [item for page in pages for item in page]
          old = next((item for item in comments if marker in item.get('body','')), None)
          payload = json.dumps({'body': body})
          if old:
              gh(['--method','PATCH',f"repos/{repo}/issues/comments/{old['id']}",'--input','-'], payload)
          else:
              gh(['--method','POST',f'repos/{repo}/issues/4/comments','--input','-'], payload)
          PY
