name: cross-branch-evidence-contract

on:
  pull_request:
    paths:
      - "formal/collect_cross_branch_formal_evidence.py"
      - "formal/collect_cross_branch_formal_evidence_test.py"
      - ".github/workflows/cross-branch-evidence-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Run evidence trust-boundary mutation tests
        run: |
          set -euo pipefail
          python3 formal/collect_cross_branch_formal_evidence_test.py
          python3 formal/collect_cross_branch_formal_evidence.py --help
          test -z "$(git status --porcelain --untracked-files=all)"
