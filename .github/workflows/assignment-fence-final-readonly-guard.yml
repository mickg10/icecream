name: assignment-fence-final-readonly-guard

on:
  pull_request:
    paths:
      - "formal/check_formal_task_workflows_readonly.py"
      - "formal/check_formal_task_workflows_readonly_test.py"
      - "formal/FINAL_FORMAL_SOURCE_FREEZE.json"
      - ".github/workflows/assignment-fence*.yml"
      - ".github/workflows/f2s*.yml"
      - ".github/workflows/cross-branch*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assignment-fence-final-readonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the guard and require final frozen read-only state
        run: |
          set -euo pipefail
          python3 formal/check_formal_task_workflows_readonly_test.py
          python3 formal/check_formal_task_workflows_readonly.py \
            --repo . \
            --require-freeze
          test -z "$(git status --porcelain --untracked-files=all)"
