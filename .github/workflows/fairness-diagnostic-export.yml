name: Fairness diagnostic export

on:
  pull_request:
    branches:
      - fix/stage3-scheduler-policy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-applied-worktree:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Decode and apply staged fairness patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/codex/pending.patch.gz.b64.* > /tmp/pending.patch.gz.b64
          base64 --decode /tmp/pending.patch.gz.b64 > /tmp/pending.patch.gz
          gzip --decompress --stdout /tmp/pending.patch.gz > /tmp/pending.patch
          expected=$(cat .github/codex/pending.patch.sha256)
          printf '%s  %s\n' "$expected" /tmp/pending.patch | sha256sum --check --strict
          git apply --check /tmp/pending.patch
          git apply /tmp/pending.patch
      - name: Package applied worktree and patch
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=applied-fairness-source.tar.gz -czf applied-fairness-source.tar.gz .
          cp /tmp/pending.patch applied-fairness.patch
      - uses: actions/upload-artifact@v4
        with:
          name: applied-fairness-diagnostic
          path: |
            applied-fairness-source.tar.gz
            applied-fairness.patch
          retention-days: 1
          if-no-files-found: error
