name: cleanup-compatibility-temporary-files

on:
  pull_request:
    paths:
      - ".github/workflows/cleanup-compat-temp.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove one-shot repair files and this cleanup workflow
        run: |
          set -euo pipefail
          git config user.name "mickg10 formal automation"
          git config user.email "5094033+mickg10@users.noreply.github.com"
          git rm -f \
            .github/workflows/fix-compat-precedence.yml \
            formal/fix_compatibility_precedence_once.py \
            .github/workflows/cleanup-compat-temp.yml
          git commit -m "ci: remove temporary compatibility repair machinery"
          git push origin HEAD:${{ github.head_ref }}
