name: Protocol 50 formal checks

on:
  push:
    branches:
      - bigoracle/issue16-p50-job-lifecycle-formal
    paths:
      - 'cache/formal/**'
      - '.github/workflows/p50-formal.yml'
  pull_request:
    branches:
      - implementer/issue16-p50-vertical
    paths:
      - 'cache/formal/**'
      - '.github/workflows/p50-formal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download, verify, and run Protocol-50 models
        shell: bash
        env:
          TLA2TOOLS_JAR: /tmp/tla2tools.jar
          TLC_WORKERS: '1'
          TLC_STATE_ROOT: /tmp/icecream-p50-tlc
        run: |
          set -o pipefail
          set +e
          {
            echo '=== runner ==='
            uname -a
            java -version
            echo '=== download tla2tools 1.7.4 ==='
            curl -fL --retry 3 --retry-all-errors \
              https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
              -o "$TLA2TOOLS_JAR"
            rc=$?
            echo "curl_exit=$rc"
            if [ "$rc" -ne 0 ]; then exit "$rc"; fi

            echo '=== checksum ==='
            echo 'bee4a54f3ee3d4afc347c3240ec2d9e93b075104  /tmp/tla2tools.jar' \
              | sha1sum -c -
            rc=$?
            echo "checksum_exit=$rc"
            if [ "$rc" -ne 0 ]; then exit "$rc"; fi

            echo '=== tlc ==='
            sh cache/formal/run_tlc.sh
          } > >(tee /tmp/p50-tlc.log) 2>&1
          rc=$?
          echo "formal_exit=$rc" | tee -a /tmp/p50-tlc.log
          exit "$rc"

      - name: Upload TLC log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p50-tlc-log
          path: /tmp/p50-tlc.log
          if-no-files-found: warn
