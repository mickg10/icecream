name: Protocol 50 formal checks

on:
  push:
    branches:
      - bigoracle/issue16-p50-job-lifecycle-formal
    paths:
      - 'cache/formal/**'
      - '.github/workflows/p50-formal.yml'
  pull_request:
    branches:
      - implementer/issue16-p50-vertical
    paths:
      - 'cache/formal/**'
      - '.github/workflows/p50-formal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and verify TLA+ tools 1.7.4
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            -o /tmp/tla2tools.jar
          # Official v1.7.4 release checksum published by tlaplus/tlaplus.
          echo 'bee4a54f3ee3d4afc347c3240ec2d9e93b075104  /tmp/tla2tools.jar' \
            | sha1sum -c -

      - name: Model-check cache and job lifecycles
        shell: bash
        env:
          TLA2TOOLS_JAR: /tmp/tla2tools.jar
          TLC_WORKERS: '1'
          TLC_STATE_ROOT: /tmp/icecream-p50-tlc
        run: |
          set -euo pipefail
          sh cache/formal/run_tlc.sh 2>&1 | tee /tmp/p50-tlc.log

      - name: Upload TLC log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p50-tlc-log
          path: /tmp/p50-tlc.log
          if-no-files-found: warn
