name: assignment-fence-reviewed-fixes-once

on:
  push:
    branches:
      - bigoracle/assignment-fence-proof-v4
    paths:
      - .github/workflows/assignment-fence-reviewed-fixes-once.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bigoracle/assignment-fence-proof-v4
          fetch-depth: 0
      - name: Import only the reviewed corrections
        run: |
          set -euo pipefail
          git config user.name "mickg10 formal automation"
          git config user.email "5094033+mickg10@users.noreply.github.com"
          git fetch --no-tags origin \
            375873981129fc6fdb50e7fd8f426582b9d00ea6 \
            c87aebcd6f22285515e05b39d78714898fa7f0e4
          git cherry-pick --no-commit 375873981129fc6fdb50e7fd8f426582b9d00ea6
          git cherry-pick --no-commit c87aebcd6f22285515e05b39d78714898fa7f0e4
          git diff --cached --check
          git diff --cached --stat
      - name: Preserve and verify the finite FIFO quotient
        run: |
          set -euo pipefail
          test -f formal/assignment_fence_network_quotient_test.py
          python3 formal/assignment_fence_network_quotient_test.py
          python3 formal/run_formal_checks_v4_test.py
          if test -f formal/tla_primed_assignment_lint_test.py; then
            python3 formal/tla_primed_assignment_lint_test.py
          fi
      - name: Commit reviewed corrections and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/assignment-fence-reviewed-fixes-once.yml
          git add -A
          git diff --cached --check
          git commit -m "formal: carry reviewed model and proof corrections into v4 gate"
          git push origin HEAD:bigoracle/assignment-fence-proof-v4
