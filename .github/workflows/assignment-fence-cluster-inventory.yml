name: assignment-fence-cluster-inventory

on:
  pull_request:
    paths:
      - "formal/**"
      - "Makefile.am"
      - "**/Makefile.am"
      - "unittests/**"
      - "tests/**"
      - ".github/workflows/assignment-fence-cluster-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: assignment-fence-cluster-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate repository-derived execution inventory
        run: |
          set -euo pipefail
          mkdir -p /tmp/assignment-fence-cluster-inventory
          python3 formal/generate_cluster_execution_inventory.py \
            --repo . \
            --output /tmp/assignment-fence-cluster-inventory/CLUSTER_EXECUTION_INVENTORY.md \
            --json-output /tmp/assignment-fence-cluster-inventory/inventory.json
          cat /tmp/assignment-fence-cluster-inventory/CLUSTER_EXECUTION_INVENTORY.md
      - name: Archive full inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-fence-cluster-inventory-${{ github.sha }}
          path: /tmp/assignment-fence-cluster-inventory
          if-no-files-found: error
          retention-days: 30
      - name: Publish cluster-inventory status
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path

          marker = '<!-- assignment-fence-cluster-inventory-status -->'
          path = Path('/tmp/assignment-fence-cluster-inventory/inventory.json')
          if path.exists():
              document = json.loads(path.read_text())
              build = len(document['build_commands'])
              variables = len(document['make_variables'])
              files = len(document['test_files'])
              manifests = len(document['formal_manifests'])
              modes = {
                  name: len(matches)
                  for name, matches in document['modes'].items()
              }
              summary = '\n'.join([
                  f'build commands: {build}',
                  f'Makefile test/program variables: {variables}',
                  f'test scripts/sources: {files}',
                  f'formal manifests: {manifests}',
                  'scheduler modes:',
                  *[f'  {name}: {count} references' for name, count in modes.items()],
                  'scale tiers: smoke, 10F/100C, 25F/1000C, 50F/5000C, 50F/10000+C',
              ])
              state = 'generated'
          else:
              summary = 'Inventory generation failed before JSON evidence was retained.'
              state = 'red'
          body = '\n'.join([
              marker,
              'From: mickg10/bigoracle',
              'To: mickg10/implementer, mickg10/local-oracle, mickgvirtu/implementer',
              '',
              '## mickg10 cluster execution inventory',
              '',
              f"- exact head: `{os.environ['GITHUB_SHA']}`",
              f"- workflow run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- state: **{state}**",
              '',
              '```text', summary, '```',
              '',
              'The artifact contains the complete repository-discovered run list plus setup, topology, scenario, metric, and evidence requirements for 10–50 fulfillment daemons and thousands of old/new clients. Presence in the inventory is not a pass result.'
          ])
          repo = os.environ['GITHUB_REPOSITORY']
          def gh(arguments, payload=None):
              return subprocess.run(['gh','api',*arguments], input=payload, text=True, stdout=subprocess.PIPE, check=True, env=os.environ).stdout
          comments = json.loads(gh([f'repos/{repo}/issues/4/comments?per_page=100']))
          old = next((item for item in comments if marker in item.get('body', '')), None)
          payload = json.dumps({'body': body})
          if old:
              gh(['--method','PATCH',f"repos/{repo}/issues/comments/{old['id']}",'--input','-'], payload)
          else:
              gh(['--method','POST',f'repos/{repo}/issues/4/comments','--input','-'], payload)
          PY
