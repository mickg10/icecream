name: assignment-fence-static-contract

on:
  pull_request:
    paths:
      - "formal/assignment-fence-proof-checks-v1.json"
      - "formal/assignment_fence_static_check.py"
      - "formal/assignment_fence_static_check_test.py"
      - "formal/AssignmentFenceCore*.tla"
      - "formal/AssignmentFenceNetwork*.tla"
      - "formal/AssignmentFenceAdmissionModes.tla"
      - "formal/*.cfg"
      - "formal/trace-manifests/*.json"
      - ".github/workflows/assignment-fence-static-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce generated model inputs
        run: |
          set -euo pipefail
          python3 formal/apply_assignment_fence_network_quotient.py
          python3 formal/generate_assignment_fence_admission_modes.py
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Exact static contract and mutation suite
        run: |
          set -euo pipefail
          python3 formal/assignment_fence_static_check.py \
            --manifest formal/assignment-fence-proof-checks-v1.json \
            --repo . \
            --formal-dir formal
          python3 formal/assignment_fence_static_check_test.py
          python3 formal/assignment_fence_proof_manifest_contract_test.py
          python3 formal/assignment_fence_premise_coverage_test.py
          python3 formal/assignment_fence_premise_coverage_test_v2.py
          test -z "$(git status --porcelain --untracked-files=all)"
