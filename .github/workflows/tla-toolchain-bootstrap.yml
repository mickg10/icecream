name: TLA toolchain bootstrap

on:
  pull_request:
    branches:
      - fix/stage3-scheduler-policy
    paths:
      - .github/tla-bootstrap.trigger
      - .github/workflows/tla-toolchain-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-toolchain:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official TLA+ toolchains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tla-toolchain
          curl --fail --location --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output tla-toolchain/tla2tools-1.7.4.jar
          curl --fail --location --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            --output tla-toolchain/tla2tools-1.8.0.jar
          (cd tla-toolchain && sha256sum tla2tools-*.jar > SHA256SUMS)

      - name: Validate TLC entry points
        shell: bash
        run: |
          set -euo pipefail
          java -cp tla-toolchain/tla2tools-1.7.4.jar tlc2.TLC -help >/tmp/tlc-1.7.4.help
          java -cp tla-toolchain/tla2tools-1.8.0.jar tlc2.TLC -help >/tmp/tlc-1.8.0.help
          grep -q 'TLC' /tmp/tlc-1.7.4.help
          grep -q 'TLC' /tmp/tlc-1.8.0.help
          cat tla-toolchain/SHA256SUMS

      - name: Upload pinned toolchain
        uses: actions/upload-artifact@v4
        with:
          name: tla-toolchain
          path: tla-toolchain
          if-no-files-found: error
          retention-days: 1
