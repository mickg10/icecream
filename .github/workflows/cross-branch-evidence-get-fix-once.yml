name: cross-branch-evidence-get-fix-once

on:
  push:
    branches:
      - bigoracle/assignment-fence-proof-v4
    paths:
      - ".github/workflows/cross-branch-evidence-get-fix-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bigoracle/assignment-fence-proof-v4
          fetch-depth: 0
      - name: Make every field-bearing GitHub API query explicitly GET
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('formal/collect_cross_branch_formal_evidence.py')
          text = path.read_text(encoding='utf-8')
          endpoints = (
              '            f"repos/{repository}/actions/runs",\n',
              '        [f"repos/{repository}/actions/runs/{run_id}/jobs", "-f", "per_page=100"]\n',
              '        [f"repos/{repository}/actions/runs/{run_id}/artifacts", "-f", "per_page=100"]\n',
          )
          replacements = (
              '            "--method",\n            "GET",\n            f"repos/{repository}/actions/runs",\n',
              '        ["--method", "GET", f"repos/{repository}/actions/runs/{run_id}/jobs", "-f", "per_page=100"]\n',
              '        ["--method", "GET", f"repos/{repository}/actions/runs/{run_id}/artifacts", "-f", "per_page=100"]\n',
          )
          for old, new in zip(endpoints, replacements, strict=True):
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'unexpected API endpoint cardinality for {old!r}')
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'neither old nor fixed API endpoint is present: {old!r}')
          path.write_text(text, encoding='utf-8')
          PY
          python3 formal/collect_cross_branch_formal_evidence.py --help
          git diff --check
      - name: Commit correction and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/cross-branch-evidence-get-fix-once.yml
          git config user.name "mickg10 formal automation"
          git config user.email "5094033+mickg10@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "formal: use GET for immutable workflow evidence queries"
          git push origin HEAD:bigoracle/assignment-fence-proof-v4
