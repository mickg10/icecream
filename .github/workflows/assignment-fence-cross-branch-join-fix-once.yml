name: assignment-fence-cross-branch-join-fix-once

on:
  push:
    branches:
      - bigoracle/assignment-fence-proof-v4
    paths:
      - ".github/workflows/assignment-fence-cross-branch-join-fix-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bigoracle/assignment-fence-proof-v4
          fetch-depth: 0
      - name: Make cross-branch closure run on every final formal head
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cross = Path('.github/workflows/cross-branch-formal-evidence.yml')
          text = cross.read_text(encoding='utf-8')
          old = '''  pull_request:\n    paths:\n      - "formal/collect_cross_branch_formal_evidence.py"\n      - ".github/workflows/cross-branch-formal-evidence.yml"\n'''
          new = '''  pull_request:\n    paths:\n      - "formal/**"\n      - ".github/workflows/cross-branch-formal-evidence.yml"\n'''
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('cross-branch trigger block changed')
          cross.write_text(text, encoding='utf-8')

          complete = Path('.github/workflows/assignment-fence-complete-formal-gate.yml')
          text = complete.read_text(encoding='utf-8')
          marker = 'Join exact cross-branch prerequisite and compatibility closure'
          if marker not in text:
              anchor = '      - name: Write combined machine-readable verdict\n'
              if text.count(anchor) != 1:
                  raise SystemExit('complete-gate result anchor changed')
              step = '''      - name: Join exact cross-branch prerequisite and compatibility closure\n        run: |\n          set -euo pipefail\n          root=/tmp/assignment-fence-complete\n          joined=''\n          for attempt in $(seq 1 60); do\n            runs=$(gh api --method GET \\\n              "repos/$GITHUB_REPOSITORY/actions/runs" \\\n              -f "head_sha=$GITHUB_SHA" \\\n              -f status=completed \\\n              -f per_page=100)\n            run=$(printf '%s' "$runs" | jq -c \\\n              '[.workflow_runs[] | select(.name == "cross-branch-formal-evidence" and .head_sha == env.GITHUB_SHA)] | sort_by(.created_at, .id) | reverse | .[0] // empty')\n            if test -n "$run"; then\n              conclusion=$(printf '%s' "$run" | jq -r '.conclusion')\n              if test "$conclusion" != success; then\n                printf '%s\\n' "$run" > "$root/cross-branch-run.json"\n                echo "cross-branch formal evidence completed with $conclusion" >&2\n                exit 1\n              fi\n              run_id=$(printf '%s' "$run" | jq -r '.id')\n              artifacts=$(gh api --method GET \\\n                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \\\n                -f per_page=100)\n              artifact=$(printf '%s' "$artifacts" | jq -c \\\n                '[.artifacts[] | select((.name | startswith("cross-branch-formal-evidence-")) and (.expired | not))] | if length == 1 then .[0] else empty end')\n              test -n "$artifact"\n              digest=$(printf '%s' "$artifact" | jq -r '.digest // empty')\n              case "$digest" in sha256:*) ;; *) echo 'cross-branch artifact lacks SHA-256 digest' >&2; exit 1 ;; esac\n              jq -n \\\n                --argjson run "$run" \\\n                --argjson artifact "$artifact" \\\n                '{schema:1, run:$run, artifact:$artifact}' \\\n                > "$root/cross-branch-join.json"\n              joined=yes\n              break\n            fi\n            sleep 10\n          done\n          test "$joined" = yes\n\n'''
              text = text.replace(anchor, step + anchor)

              old_result = '''              'focused_exit': read_exit('focused'),\n              'proof_strategy_sha256': file_hash(root / 'support' / 'assignment-fence-proof-strategy.json'),\n'''
              new_result = '''              'focused_exit': read_exit('focused'),\n              'cross_branch_join': (\n                  json.loads((root / 'cross-branch-join.json').read_text())\n                  if (root / 'cross-branch-join.json').exists()\n                  else None\n              ),\n              'proof_strategy_sha256': file_hash(root / 'support' / 'assignment-fence-proof-strategy.json'),\n'''
              if text.count(old_result) != 1:
                  raise SystemExit('complete-gate result document anchor changed')
              text = text.replace(old_result, new_result)

              old_verdict = '''              if document['quotient_exit'] == '0' and document['focused_exit'] == '0'\n              else 'RED'\n'''
              new_verdict = '''              if document['quotient_exit'] == '0'\n              and document['focused_exit'] == '0'\n              and document['cross_branch_join'] is not None\n              and document['cross_branch_join']['run']['conclusion'] == 'success'\n              else 'RED'\n'''
              if text.count(old_verdict) != 1:
                  raise SystemExit('complete-gate verdict anchor changed')
              text = text.replace(old_verdict, new_verdict)

              old_publish = '''              f"- proof-bearing runner exit: `{result.get('focused_exit')}`",\n              f"- verdict: **{result.get('verdict', 'RED')}**",\n'''
              new_publish = '''              f"- proof-bearing runner exit: `{result.get('focused_exit')}`",\n              f"- cross-branch closure run: `{((result.get('cross_branch_join') or {}).get('run') or {}).get('id', 'missing')}`",\n              f"- cross-branch closure artifact digest: `{((result.get('cross_branch_join') or {}).get('artifact') or {}).get('digest', 'missing')}`",\n              f"- verdict: **{result.get('verdict', 'RED')}**",\n'''
              if text.count(old_publish) != 1:
                  raise SystemExit('complete-gate publisher anchor changed')
              text = text.replace(old_publish, new_publish)

              old_scope = '''This is the sole combined formal verdict for the assignment-fence branch. GREEN requires, on this exact clean SHA, reproducible generated sources and proof strategy; all support contracts; lockstep quotient checking; both pinned TLC distributions with nonzero states; every expected trace/harness contract; semantic differential agreement; positive resource evidence; and zero failed TLAPS obligations. GREEN still does not accept product codecs, mixed binaries, cluster performance, or rollout.'''
              new_scope = '''This is the sole overall formal verdict for the assignment-fence work. GREEN additionally requires an exact successful same-consuming-SHA cross-branch closure that resolves and verifies the prerequisite and compatibility branches, jobs, artifact digests, and fresh no-tool preflights. It still does not accept product codecs, mixed binaries, cluster performance, or rollout.'''
              if text.count(old_scope) != 1:
                  raise SystemExit('complete-gate scope text changed')
              text = text.replace(old_scope, new_scope)
          complete.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit evidence join and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/assignment-fence-cross-branch-join-fix-once.yml
          git config user.name "mickg10 formal automation"
          git config user.email "5094033+mickg10@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: join immutable prerequisite and compatibility evidence"
          git push origin HEAD:bigoracle/assignment-fence-proof-v4
