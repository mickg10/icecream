name: assignment-fence-refinement-precedence-fix-once

on:
  push:
    branches:
      - bigoracle/assignment-fence-proof-v4
    paths:
      - ".github/workflows/assignment-fence-refinement-precedence-fix-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bigoracle/assignment-fence-proof-v4
          fetch-depth: 0
      - name: Parenthesize the exact start authorization disjunction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('formal/AssignmentFenceModeRefinement.tla')
          text = path.read_text(encoding='utf-8')
          old = '''    /\\ (matched /\\ ~revoked)\n        \\/ (MutantStartBeforeGrant\n            /\\ claimArrived\n            /\\ pendingCount > 0\n            /\\ ~authorizationSeen)\n'''
          new = '''    /\\ ((matched /\\ ~revoked)\n        \\/ (MutantStartBeforeGrant\n            /\\ claimArrived\n            /\\ pendingCount > 0\n            /\\ ~authorizationSeen))\n'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('unexpected start-guard cardinality')
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('neither ambiguous nor explicit start guard is present')
          path.write_text(text, encoding='utf-8')
          PY
          python3 formal/mode_refinement_static_check.py \
            --manifest formal/mode-refinement-checks-v1.json \
            --repo . \
            --formal-dir formal
          python3 formal/mode_refinement_static_check_test.py
          python3 formal/mode_refinement_fairness_contract_test.py
          git diff --check
      - name: Commit explicit guard and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/assignment-fence-refinement-precedence-fix-once.yml
          git config user.name "mickg10 formal automation"
          git config user.email "5094033+mickg10@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "formal: parenthesize refinement start authorization guard"
          git push origin HEAD:bigoracle/assignment-fence-proof-v4
