name: Codex issue 4 executor

on:
  pull_request:
    branches:
      - fix/stage3-scheduler-policy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue4-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  apply-test-export:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Detect a complete pending change
        id: pending
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/codex/pending.ready ]]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and apply pending change
        if: steps.pending.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .github/codex/pending.patch.gz.b64.*
          cat .github/codex/pending.patch.gz.b64.* > /tmp/pending.patch.gz.b64
          base64 --decode /tmp/pending.patch.gz.b64 > /tmp/pending.patch.gz
          gzip --decompress --stdout /tmp/pending.patch.gz > /tmp/pending.patch
          expected=$(cat .github/codex/pending.patch.sha256)
          printf '%s  %s\n' "$expected" /tmp/pending.patch | sha256sum --check --strict
          git apply --check /tmp/pending.patch
          git apply --index /tmp/pending.patch

      - name: Install build dependencies
        if: steps.pending.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            liblzo2-dev libzstd-dev libarchive-dev

      - name: Run pending verification program
        if: steps.pending.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/codex/pending.commands

      - name: Commit verified pending change
        if: steps.pending.outputs.found == 'true'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          message=$(cat .github/codex/pending.message)
          git rm .github/codex/pending.ready \
                 .github/codex/pending.message \
                 .github/codex/pending.commands \
                 .github/codex/pending.patch.sha256 \
                 .github/codex/pending.patch.gz.b64.*
          git config user.name 'mickg10 issue-4 executor'
          git config user.email '5094033+mickg10@users.noreply.github.com'
          git commit -m "$message"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Package committed repository source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=icecream-source.tar.gz HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: icecream-source
          path: icecream-source.tar.gz
          if-no-files-found: error
          retention-days: 1
