name: assignment-fence-cross-model-wire-once

on:
  push:
    branches:
      - bigoracle/assignment-fence-proof-v4
    paths:
      - ".github/workflows/assignment-fence-cross-model-wire-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bigoracle/assignment-fence-proof-v4
          fetch-depth: 0
      - name: Add policy-consistency execution and verdict fields
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/cross-branch-formal-evidence.yml')
          text = path.read_text(encoding='utf-8')
          marker = 'Verify compatibility policy agrees with consuming fence theory'
          if marker not in text:
              anchor = '''          printf '%s\\n' "$prerequisite_rc" > "$root/prerequisite-preflight.exit"\n          printf '%s\\n' "$compatibility_rc" > "$root/compatibility-preflight.exit"\n'''
              insertion = '''          printf '%s\\n' "$prerequisite_rc" > "$root/prerequisite-preflight.exit"\n          printf '%s\\n' "$compatibility_rc" > "$root/compatibility-preflight.exit"\n\n          # Verify compatibility policy agrees with consuming fence theory.\n          set +e\n          python3 formal/verify_cross_model_policy.py \\\n            --consumer-repo . \\\n            --compatibility-worktree /tmp/compatibility-evidence-worktree \\\n            --output "$root/cross-model-policy.json" \\\n            > "$root/cross-model-policy.log" 2>&1\n          policy_rc=$?\n          set -e\n          printf '%s\\n' "$policy_rc" > "$root/cross-model-policy.exit"\n'''
              if text.count(anchor) != 1:
                  raise SystemExit('cross-branch preflight exit anchor changed')
              text = text.replace(anchor, insertion)

              require_anchor = '''          cat "$root/prerequisite-preflight.log"\n          cat "$root/compatibility-preflight.log"\n          test "$prerequisite_rc" -eq 0\n          test "$compatibility_rc" -eq 0\n'''
              require_replacement = '''          cat "$root/prerequisite-preflight.log"\n          cat "$root/compatibility-preflight.log"\n          cat "$root/cross-model-policy.log"\n          test "$prerequisite_rc" -eq 0\n          test "$compatibility_rc" -eq 0\n          test "$policy_rc" -eq 0\n'''
              if text.count(require_anchor) != 1:
                  raise SystemExit('cross-branch preflight require anchor changed')
              text = text.replace(require_anchor, require_replacement)

              result_anchor = '''              'compatibility_preflight_exit': exit_value('compatibility-preflight.exit'),\n              'evidence_sha256': sha(root / 'evidence.json'),\n'''
              result_replacement = '''              'compatibility_preflight_exit': exit_value('compatibility-preflight.exit'),\n              'cross_model_policy_exit': exit_value('cross-model-policy.exit'),\n              'evidence_sha256': sha(root / 'evidence.json'),\n              'cross_model_policy_sha256': sha(root / 'cross-model-policy.json'),\n'''
              if text.count(result_anchor) != 1:
                  raise SystemExit('cross-branch result anchor changed')
              text = text.replace(result_anchor, result_replacement)

              verdict_anchor = '''              and result['compatibility_preflight_exit'] == '0'\n              else 'RED'\n'''
              verdict_replacement = '''              and result['compatibility_preflight_exit'] == '0'\n              and result['cross_model_policy_exit'] == '0'\n              else 'RED'\n'''
              if text.count(verdict_anchor) != 1:
                  raise SystemExit('cross-branch verdict anchor changed')
              text = text.replace(verdict_anchor, verdict_replacement)

              excerpt_anchor = '''          for name in ('collector', 'prerequisite-preflight', 'compatibility-preflight'):\n'''
              excerpt_replacement = '''          for name in ('collector', 'prerequisite-preflight', 'compatibility-preflight', 'cross-model-policy'):\n'''
              if text.count(excerpt_anchor) != 1:
                  raise SystemExit('cross-branch excerpt anchor changed')
              text = text.replace(excerpt_anchor, excerpt_replacement)

              publish_anchor = '''              f"- verdict: **{result.get('verdict','RED')}**",\n'''
              publish_replacement = '''              f"- cross-model policy exit: `{result.get('cross_model_policy_exit','not-started')}`",\n              f"- cross-model policy SHA-256: `{result.get('cross_model_policy_sha256') or 'missing'}`",\n              f"- verdict: **{result.get('verdict','RED')}**",\n'''
              if text.count(publish_anchor) != 1:
                  raise SystemExit('cross-branch publisher anchor changed')
              text = text.replace(publish_anchor, publish_replacement)

              scope_anchor = '''GREEN means each moving branch was resolved to an exact SHA, its ordinary workflow was read-only and successful at that SHA, every job succeeded, all expected retained artifacts were live and SHA-256 identified, and the exact source closure passed a fresh clean no-tool preflight. The retained artifacts—not this summary—remain the TLC evidence.'''
              scope_replacement = '''GREEN means each moving branch was resolved to an exact SHA, its ordinary workflow was read-only and successful at that SHA, every job succeeded, all expected retained artifacts were live and SHA-256 identified, the exact source closure passed a fresh clean no-tool preflight, and the compatibility policy/limitation witnesses agree with the consuming assignment-fence theory. The retained artifacts—not this summary—remain the TLC evidence.'''
              if text.count(scope_anchor) != 1:
                  raise SystemExit('cross-branch scope anchor changed')
              text = text.replace(scope_anchor, scope_replacement)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit integration and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/assignment-fence-cross-model-wire-once.yml
          git config user.name "mickg10 formal automation"
          git config user.email "5094033+mickg10@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: require cross-model policy agreement in evidence closure"
          git push origin HEAD:bigoracle/assignment-fence-proof-v4
