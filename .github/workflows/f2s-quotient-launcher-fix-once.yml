name: f2s-quotient-launcher-fix-once

on:
  push:
    branches:
      - bigoracle/assignment-fence-proof-v4
    paths:
      - ".github/workflows/f2s-quotient-launcher-fix-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bigoracle/assignment-fence-proof-v4
          fetch-depth: 0
      - name: Add adaptive domain and checker-argument mapping
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('formal/run_f2s_quotient_checks.py')
          text = path.read_text(encoding='utf-8')
          marker = 'F2S_RUNNER_V4_DOMAIN_ARGS'
          if marker not in text:
              anchor = '    only = os.environ.get("F2S_QUOTIENT_ONLY")\n'
              if text.count(anchor) != 1:
                  raise SystemExit('quotient launcher insertion anchor changed')
              insertion = '''    # F2S_RUNNER_V4_DOMAIN_ARGS: supply domain metadata and repeated\n    # static-checker argv only when the generation-4 runner exposes them.\n    checker_arguments = [\n        "--manifest",\n        str(manifest),\n        "--repo",\n        str(repo),\n        "--formal-dir",\n        "formal",\n    ]\n    for option in (\n        "--static-checker-arg",\n        "--checker-arg",\n        "--static-arg",\n    ):\n        if option in options:\n            for argument in checker_arguments:\n                command.extend([option, argument])\n            supplied.add(option)\n            break\n\n    for candidates, value in (\n        (("--domain", "--domain-name", "--suite-name"), "f2s-quotient"),\n        (("--expected-check-count", "--check-count"), "3"),\n    ):\n        chosen = add_supported(command, options, candidates, value)\n        if chosen:\n            supplied.add(chosen)\n\n'''
              text = text.replace(anchor, insertion + anchor)
          path.write_text(text, encoding='utf-8')
          PY
          python3 formal/run_f2s_quotient_checks.py --help
          python3 formal/f2s_quotient_static_check_test.py
          git diff --check
      - name: Commit launcher hardening and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/f2s-quotient-launcher-fix-once.yml
          git config user.name "mickg10 formal automation"
          git config user.email "5094033+mickg10@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "formal: adapt quotient gate to runner-v4 domain arguments"
          git push origin HEAD:bigoracle/assignment-fence-proof-v4
