name: assignment-fence-fairness-wire-once

on:
  push:
    branches:
      - bigoracle/assignment-fence-proof-v4
    paths:
      - ".github/workflows/assignment-fence-fairness-wire-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bigoracle/assignment-fence-proof-v4
          fetch-depth: 0
      - name: Add fairness contract to static, sweep, and complete gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files_and_anchors = (
              (
                  Path('.github/workflows/assignment-fence-static-contract.yml'),
                  '          python3 formal/assignment_fence_premise_coverage_test_v2.py\n',
              ),
              (
                  Path('.github/workflows/assignment-fence-final-sweep-once.yml'),
                  '          python3 formal/assignment_fence_premise_coverage_test_v2.py\n',
              ),
              (
                  Path('.github/workflows/assignment-fence-complete-formal-gate.yml'),
                  '          python3 formal/assignment_fence_premise_coverage_test_v2.py\n',
              ),
          )
          line = '          python3 formal/assignment_fence_fairness_contract_test.py\n'
          for path, anchor in files_and_anchors:
              text = path.read_text(encoding='utf-8')
              if line not in text:
                  if text.count(anchor) != 1:
                      raise SystemExit(f'{path}: fairness insertion anchor changed')
                  text = text.replace(anchor, anchor + line)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit wiring and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/assignment-fence-fairness-wire-once.yml
          git config user.name "mickg10 formal automation"
          git config user.email "5094033+mickg10@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: require narrow fairness in final formal closure"
          git push origin HEAD:bigoracle/assignment-fence-proof-v4
