name: assignment-fence-complete-formal-gate

on:
  pull_request:
    paths:
      - "formal/**"
      - ".github/workflows/assignment-fence-proof-freeze-once.yml"
      - ".github/workflows/assignment-fence-complete-formal-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: assignment-fence-complete-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  TLC_174_SHA256: "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"
  TLC_180_SHA256: "e22f8ffb4bacdea0a871f444dd94fe5fb0d8013b3388ae39e82e26f852c735d5"

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require final frozen branch and reproduce every generated input
        run: |
          set -euo pipefail
          root=/tmp/assignment-fence-complete
          mkdir -p "$root/support"

          for path in \
            .github/workflows/assignment-fence-reconcile-v2-once.yml \
            .github/workflows/assignment-fence-proof-search-v2-once.yml \
            .github/workflows/assignment-fence-proof-freeze-once.yml
          do
            test ! -e "$path"
          done
          if grep -R -l -E '^\s*contents:\s*write\s*$' \
            .github/workflows/assignment-fence*.yml; then
            echo 'write-enabled assignment-fence workflow remains' >&2
            exit 1
          fi

          test -f formal/assignment-fence-proof-strategy.json
          python3 formal/apply_assignment_fence_network_quotient.py
          python3 formal/generate_assignment_fence_admission_modes.py
          python3 formal/reproduce_assignment_fence_core_proof.py --check
          test -z "$(git status --porcelain --untracked-files=all)"

          python3 formal/assignment_fence_network_quotient_test.py
          python3 formal/assignment_fence_proof_manifest_contract_test.py
          python3 formal/assignment_fence_premise_coverage_test.py
          python3 formal/assignment_fence_premise_coverage_test_v2.py
          python3 formal/f2s_quotient_static_check.py \
            --manifest formal/f2s-quotient-checks-v1.json \
            --repo . \
            --formal-dir formal
          python3 formal/f2s_quotient_static_check_test.py
          python3 formal/validate_cluster_run_plan_test.py
          python3 formal/assignment_fence_code_inventory_test.py
          python3 formal/trace_to_harness_test.py
          python3 formal/tlc_text_trace_test.py
          python3 formal/normalize_tlc_trace_test.py
          python3 formal/run_formal_checks_v4_test.py
          python3 formal/run_tlc_only_checks_v4_test.py
          if test -f formal/tla_primed_assignment_lint_test.py; then
            python3 formal/tla_primed_assignment_lint_test.py
          fi

          python3 formal/generate_assignment_fence_code_inventory.py \
            --repo . \
            --output "$root/support/model-to-code.md" \
            --json-output "$root/support/model-to-code.json"
          python3 formal/generate_cluster_execution_inventory.py \
            --repo . \
            --output "$root/support/cluster-inventory.md" \
            --json-output "$root/support/cluster-inventory.json"
          cp formal/ASSIGNMENT_FENCE_THEORY.md "$root/support/"
          cp formal/REAL_CODEC_AND_MIXED_BINARY_GATE.md "$root/support/"
          cp formal/UPSTREAM_LANDING_PLAN.md "$root/support/"
          cp formal/assignment-fence-proof-strategy.json "$root/support/"
          git rev-parse HEAD > "$root/support/revision.txt"
          git status --porcelain --untracked-files=all \
            > "$root/support/git-status.txt"
          test ! -s "$root/support/git-status.txt"
      - name: Install execution prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless time curl jq libgmp10 z3
      - name: Resolve and verify all pinned formal tools
        run: |
          set -euo pipefail
          root=/tmp/assignment-fence-complete
          mkdir -p "$root/tools" /tmp/tlaps
          curl --fail --location --retry 4 --retry-all-errors \
            -o /tmp/tla2tools-1.7.4.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          curl --fail --location --retry 4 --retry-all-errors \
            -o /tmp/tla2tools-1.8.0.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          printf '%s  %s\n' "$TLC_174_SHA256" /tmp/tla2tools-1.7.4.jar | sha256sum -c -
          printf '%s  %s\n' "$TLC_180_SHA256" /tmp/tla2tools-1.8.0.jar | sha256sum -c -
          sha256sum /tmp/tla2tools-1.7.4.jar /tmp/tla2tools-1.8.0.jar \
            > "$root/tools/tlc-digests.txt"
          java -version > "$root/tools/java-version.txt" 2>&1

          release=''
          for tag in v1.5.0 1.5.0; do
            if curl --fail --location --retry 3 --retry-all-errors \
              -o /tmp/tlapm-release.json \
              "https://api.github.com/repos/tlaplus/tlapm/releases/tags/${tag}"; then
              release=$tag
              break
            fi
          done
          test -n "$release"
          python3 - <<'PY' >/tmp/tlapm-asset.env
          import json
          from pathlib import Path
          release = json.loads(Path('/tmp/tlapm-release.json').read_text())
          assets = [
              asset for asset in release.get('assets', [])
              if asset.get('name', '').lower().endswith('x86_64-linux-gnu-inst.bin')
          ]
          if len(assets) != 1:
              raise SystemExit([asset.get('name') for asset in release.get('assets', [])])
          asset = assets[0]
          print(f"TLAPS_ASSET_URL={asset['browser_download_url']}")
          print(f"TLAPS_ASSET_NAME={asset['name']}")
          print(f"TLAPS_ASSET_DIGEST={asset.get('digest') or ''}")
          PY
          source /tmp/tlapm-asset.env
          curl --fail --location --retry 4 --retry-all-errors \
            -o /tmp/tlaps-installer.bin "$TLAPS_ASSET_URL"
          actual="sha256:$(sha256sum /tmp/tlaps-installer.bin | awk '{print $1}')"
          printf '%s\n' "$release" > "$root/tools/tlaps-release-tag.txt"
          printf '%s\n' "$TLAPS_ASSET_NAME" > "$root/tools/tlaps-asset-name.txt"
          printf '%s\n' "$TLAPS_ASSET_DIGEST" > "$root/tools/tlaps-release-digest.txt"
          printf '%s\n' "$actual" > "$root/tools/tlaps-installer-digest.txt"
          if test -n "$TLAPS_ASSET_DIGEST"; then
            test "$actual" = "$TLAPS_ASSET_DIGEST"
          fi
          chmod +x /tmp/tlaps-installer.bin
          /tmp/tlaps-installer.bin -d /tmp/tlaps \
            > "$root/tools/tlaps-install.log" 2>&1
          TLAPM=$(find /tmp/tlaps -type f -name tlapm -perm -111 | head -n 1)
          test -n "$TLAPM"
          backend_dir=$(find /tmp/tlaps -type f \( -name zenon -o -name z3 -o -name cvc4 -o -name cvc5 \) -printf '%h\n' | head -n 1)
          if test -z "$backend_dir"; then
            backend_dir=$(dirname "$(command -v z3)")
          fi
          printf '%s\n' "$TLAPM" > "$root/tools/tlapm-path.txt"
          printf '%s\n' "$backend_dir" > "$root/tools/backend-dir.txt"
          "$TLAPM" --version > "$root/tools/tlapm-version.txt" 2>&1 || \
          "$TLAPM" -v > "$root/tools/tlapm-version.txt" 2>&1 || true
      - name: Execute quotient correspondence matrix
        id: quotient
        run: |
          set -euo pipefail
          root=/tmp/assignment-fence-complete/quotient
          mkdir -p "$root"
          command=(
            python3 formal/run_f2s_quotient_checks.py
            --repo .
            --manifest formal/f2s-quotient-checks-v1.json
            --artifacts "$root/artifacts"
            --expected-git-sha "$(git rev-parse HEAD)"
            --stable-jar /tmp/tla2tools-1.7.4.jar
            --stable-sha256 "$TLC_174_SHA256"
            --differential-jar /tmp/tla2tools-1.8.0.jar
            --differential-sha256 "$TLC_180_SHA256"
          )
          printf '%q ' "${command[@]}" > "$root/command.txt"
          printf '\n' >> "$root/command.txt"
          set +e
          /usr/bin/time -v -o "$root/time.txt" \
            "${command[@]}" > "$root/runner.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$root/exit.txt"
          cat "$root/runner.log"
          cat "$root/time.txt"
          test "$rc" -eq 0
      - name: Execute proof-bearing ownership/network/mode matrix
        id: focused
        run: |
          set -euo pipefail
          tools=/tmp/assignment-fence-complete/tools
          root=/tmp/assignment-fence-complete/focused
          mkdir -p "$root"
          TLAPM=$(cat "$tools/tlapm-path.txt")
          backend_dir=$(cat "$tools/backend-dir.txt")
          export PATH="$backend_dir:$PATH"
          command=(
            python3 formal/run_assignment_fence_focused_gate.py
            --repo .
            --manifest formal/assignment-fence-proof-checks-v1.json
            --artifacts "$root/artifacts"
            --expected-git-sha "$(git rev-parse HEAD)"
            --stable-jar /tmp/tla2tools-1.7.4.jar
            --stable-sha256 "$TLC_174_SHA256"
            --differential-jar /tmp/tla2tools-1.8.0.jar
            --differential-sha256 "$TLC_180_SHA256"
            --tlapm "$TLAPM"
            --backend-dir "$backend_dir"
          )
          printf '%q ' "${command[@]}" > "$root/command.txt"
          printf '\n' >> "$root/command.txt"
          set +e
          /usr/bin/time -v -o "$root/time.txt" \
            "${command[@]}" > "$root/runner.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$root/exit.txt"
          cat "$root/runner.log"
          cat "$root/time.txt"
          test "$rc" -eq 0
      - name: Write combined machine-readable verdict
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/assignment-fence-complete')
          def read_exit(name: str) -> str:
              path = root / name / 'exit.txt'
              return path.read_text().strip() if path.exists() else 'not-started'
          def file_hash(path: Path) -> str | None:
              if not path.exists():
                  return None
              return hashlib.sha256(path.read_bytes()).hexdigest()
          document = {
              'schema': 1,
              'revision': os.environ['GITHUB_SHA'],
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'quotient_exit': read_exit('quotient'),
              'focused_exit': read_exit('focused'),
              'proof_strategy_sha256': file_hash(root / 'support' / 'assignment-fence-proof-strategy.json'),
              'quotient_log_sha256': file_hash(root / 'quotient' / 'runner.log'),
              'focused_log_sha256': file_hash(root / 'focused' / 'runner.log'),
          }
          document['verdict'] = (
              'GREEN'
              if document['quotient_exit'] == '0' and document['focused_exit'] == '0'
              else 'RED'
          )
          (root / 'result.json').write_text(
              json.dumps(document, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(document, indent=2))
          PY
      - name: Archive complete same-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-fence-complete-${{ github.sha }}
          path: /tmp/assignment-fence-complete
          if-no-files-found: error
          retention-days: 30
      - name: Publish combined formal verdict
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, subprocess
          from pathlib import Path

          marker = '<!-- assignment-fence-complete-formal-status -->'
          root = Path('/tmp/assignment-fence-complete')
          result_path = root / 'result.json'
          if result_path.exists():
              result = json.loads(result_path.read_text())
          else:
              result = {
                  'verdict': 'RED',
                  'quotient_exit': 'not-started',
                  'focused_exit': 'not-started',
              }

          excerpts = []
          for name in ('quotient', 'focused'):
              path = root / name / 'runner.log'
              if not path.exists():
                  excerpts.append(f'{name}: runner did not start')
                  continue
              lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              selected = [
                  line for line in lines
                  if any(token in line.lower() for token in (
                      'formal acceptance failed', 'failed', 'unproved', 'error:',
                      'states generated', 'distinct states', 'comparison', 'proof',
                      'trace', 'peak rss', 'runner command'
                  ))
              ]
              excerpts.append(
                  f'{name}:\n' + ('\n'.join(selected[:100]) or '\n'.join(lines[-80:]))
              )
          excerpt = '\n\n'.join(excerpts)[:13000]

          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['GITHUB_RUN_ID']
          def gh(arguments, payload=None):
              return subprocess.run(['gh','api',*arguments], input=payload, text=True, stdout=subprocess.PIPE, check=True, env=os.environ).stdout
          artifacts = json.loads(
              gh([f'repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'])
          ).get('artifacts', [])
          artifact_lines = [
              f"- `{item['name']}` — id `{item['id']}`, digest `{item.get('digest') or 'unavailable'}`"
              for item in artifacts
              if item.get('name', '').startswith('assignment-fence-complete-')
          ] or ['- NONE']

          body = '\n'.join([
              marker,
              'From: mickg10/bigoracle',
              'To: all',
              '',
              '## Complete same-SHA assignment-fence formal verdict',
              '',
              f"- exact frozen head: `{os.environ['GITHUB_SHA']}`",
              f"- workflow run: `{run_id}`",
              f"- quotient runner exit: `{result.get('quotient_exit')}`",
              f"- proof-bearing runner exit: `{result.get('focused_exit')}`",
              f"- verdict: **{result.get('verdict', 'RED')}**",
              '',
              '### Retained artifact',
              '',
              *artifact_lines,
              '',
              '```text', excerpt, '```',
              '',
              'This is the sole combined formal verdict for the assignment-fence branch. GREEN requires, on this exact clean SHA, reproducible generated sources and proof strategy; all support contracts; lockstep quotient checking; both pinned TLC distributions with nonzero states; every expected trace/harness contract; semantic differential agreement; positive resource evidence; and zero failed TLAPS obligations. GREEN still does not accept product codecs, mixed binaries, cluster performance, or rollout.'
          ])
          comments = json.loads(gh([f'repos/{repo}/issues/4/comments?per_page=100']))
          old = next((item for item in comments if marker in item.get('body','')), None)
          payload = json.dumps({'body': body})
          if old:
              gh(['--method','PATCH',f"repos/{repo}/issues/comments/{old['id']}",'--input','-'], payload)
          else:
              gh(['--method','POST',f'repos/{repo}/issues/4/comments','--input','-'], payload)
          PY
