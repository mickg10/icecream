name: assignment-fence-reconcile-v2-once

on:
  push:
    branches:
      - bigoracle/assignment-fence-proof-v4
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  TLC_180_SHA256: "e22f8ffb4bacdea0a871f444dd94fe5fb0d8013b3388ae39e82e26f852c735d5"

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: bigoracle/assignment-fence-proof-v4
      REVIEWED_PRECEDENCE: c87aebcd6f22285515e05b39d78714898fa7f0e4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bigoracle/assignment-fence-proof-v4
          fetch-depth: 0
      - name: Install SANY/TLC smoke prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless curl
          curl --fail --location --retry 4 --retry-all-errors \
            -o /tmp/tla2tools-1.8.0.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          printf '%s  %s\n' "$TLC_180_SHA256" /tmp/tla2tools-1.8.0.jar | sha256sum -c -
      - name: Regenerate one coherent formal closure
        run: |
          set -euo pipefail
          git config user.name "mickg10 formal automation"
          git config user.email "5094033+mickg10@users.noreply.github.com"
          git fetch --no-tags origin "$REVIEWED_PRECEDENCE"

          # Carry the already reviewed direct-TLC precedence corrections into
          # this runner-v4 line.  The finite quotient is reapplied immediately
          # afterward, so the accepted network semantics remain the source and
          # the synthetic absolute sequence state does not return.
          for path in \
            formal/AssignmentFenceNetwork.tla \
            formal/JobIdAllocator.tla
          do
            git show "$REVIEWED_PRECEDENCE:$path" > "$path"
          done
          for path in \
            formal/tla_primed_assignment_lint.py \
            formal/tla_primed_assignment_lint_test.py
          do
            if git cat-file -e "$REVIEWED_PRECEDENCE:$path" 2>/dev/null; then
              git show "$REVIEWED_PRECEDENCE:$path" > "$path"
            fi
          done

          python3 formal/apply_assignment_fence_network_quotient.py
          python3 formal/generate_assignment_fence_admission_modes.py
          python3 formal/generate_assignment_fence_core_proof_v2.py

          python3 formal/assignment_fence_network_quotient_test.py
          python3 formal/assignment_fence_proof_manifest_contract_test.py
          python3 formal/trace_to_harness_test.py
          python3 formal/tlc_text_trace_test.py
          python3 formal/normalize_tlc_trace_test.py
          python3 formal/run_formal_checks_v4_test.py
          python3 formal/run_tlc_only_checks_v4_test.py
          if test -f formal/tla_primed_assignment_lint_test.py; then
            python3 formal/tla_primed_assignment_lint_test.py
          fi
          if test -f formal/tla_primed_assignment_lint.py; then
            python3 formal/tla_primed_assignment_lint.py \
              formal/AssignmentFenceCore.tla \
              formal/AssignmentFenceNetwork.tla \
              formal/AssignmentFenceAdmissionModes.tla
          fi
          git diff --check
      - name: SANY/TLC-smoke every new strict and pipelined row
        run: |
          set -euo pipefail
          mkdir -p /tmp/assignment-fence-reconcile
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from pathlib import Path

          formal = Path('formal')
          document = json.loads(
              (formal / 'assignment-fence-proof-checks-v1.json').read_text()
          )
          rows = [row for row in document['checks'] if row['id'].startswith('p49-')]
          if len(rows) != 10:
              raise SystemExit(f'expected 10 p49 rows, found {len(rows)}')

          parse_failures = (
              'parse error',
              'semantic error',
              'cannot find source file',
              'successor state is not completely specified',
              'exception in thread',
          )
          summary = []
          for row in rows:
              command = [
                  'timeout', '--signal=TERM', '--kill-after=5s', '120s',
                  'java', '-XX:+UseParallelGC', '-jar',
                  '/tmp/tla2tools-1.8.0.jar', '-workers', '1',
                  '-config', row['config'], row['module'],
              ]
              completed = subprocess.run(
                  command,
                  cwd=formal,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              output = completed.stdout
              log = Path('/tmp/assignment-fence-reconcile') / f"{row['id']}.log"
              log.write_text(output, encoding='utf-8')
              lowered = output.lower()
              if any(token in lowered for token in parse_failures):
                  raise SystemExit(f"{row['id']}: parser/semantic failure\n{output}")
              states = re.search(r'([0-9][0-9,]*) states generated', output)
              distinct = re.search(r'([0-9][0-9,]*) distinct states found', output)
              if states is None or distinct is None:
                  raise SystemExit(f"{row['id']}: missing state counts\n{output}")
              if int(states.group(1).replace(',', '')) <= 0:
                  raise SystemExit(f"{row['id']}: zero generated states")
              if int(distinct.group(1).replace(',', '')) <= 0:
                  raise SystemExit(f"{row['id']}: zero distinct states")
              if row['expected'] == 'pass':
                  if completed.returncode != 0:
                      raise SystemExit(
                          f"{row['id']}: expected pass rc={completed.returncode}\n{output}"
                      )
                  if not (
                      'model checking completed' in lowered
                      or 'no error has been found' in lowered
                  ):
                      raise SystemExit(f"{row['id']}: no completion marker\n{output}")
              else:
                  if completed.returncode == 0:
                      raise SystemExit(f"{row['id']}: expected counterexample passed")
                  violation = (
                      'is violated' in lowered
                      or 'temporal properties were violated' in lowered
                  )
                  if not violation:
                      raise SystemExit(
                          f"{row['id']}: non-property failure rc={completed.returncode}\n{output}"
                      )
              summary.append({
                  'id': row['id'],
                  'expected': row['expected'],
                  'returncode': completed.returncode,
                  'generated': int(states.group(1).replace(',', '')),
                  'distinct': int(distinct.group(1).replace(',', '')),
              })
          Path('/tmp/assignment-fence-reconcile/smoke-summary.json').write_text(
              json.dumps(summary, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Remove all superseded write-enabled workflows
        id: converge
        run: |
          set -euo pipefail
          self=.github/workflows/assignment-fence-reconcile-v2-once.yml
          rm -f \
            .github/workflows/assignment-fence-proof-v4.yml \
            .github/workflows/assignment-fence-proof-execute.yml \
            .github/workflows/assignment-fence-quotient-once.yml \
            .github/workflows/assignment-fence-workflow-cleanup-once.yml \
            .github/workflows/assignment-fence-reviewed-fixes-once.yml \
            .github/workflows/assignment-fence-proof-search-once.yml \
            .github/workflows/assignment-fence-modes-once.yml

          git add -A
          if git diff --cached --quiet; then
            echo 'phase=freeze' >> "$GITHUB_OUTPUT"
            rm "$self"
            git add -A
          else
            echo 'phase=converge' >> "$GITHUB_OUTPUT"
          fi
          git diff --cached --check
      - name: Commit converged closure or freeze the reconciler
        run: |
          set -euo pipefail
          phase='${{ steps.converge.outputs.phase }}'
          if git diff --cached --quiet; then
            echo 'branch already converged and reconciler absent'
            exit 0
          fi
          if test "$phase" = freeze; then
            message='ci: freeze read-only assignment-fence proof gates'
          else
            message='formal: reconcile finite proof-bearing assignment-fence closure'
          fi
          git commit -m "$message"
          if ! git push origin "HEAD:$BRANCH"; then
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
      - name: Archive convergence smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-fence-reconcile-${{ github.sha }}
          path: /tmp/assignment-fence-reconcile
          if-no-files-found: warn
          retention-days: 14
      - name: Publish exact reconciliation blocker
        if: failure()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, subprocess
          from pathlib import Path

          marker = '<!-- assignment-fence-reconcile-status -->'
          logs = sorted(Path('/tmp/assignment-fence-reconcile').glob('*.log'))
          excerpt = 'Reconciliation failed before a TLC smoke log was retained.'
          for path in logs:
              text = path.read_text(encoding='utf-8', errors='replace')
              excerpt = f'{path.name}:\n{text[-8000:]}'
              break
          body = '\n'.join([
              marker,
              'From: mickg10/bigoracle',
              'To: mickg10/local-oracle, mickg10/implementer',
              '',
              '## Assignment-fence branch reconciliation is RED',
              '',
              f"- exact workflow head: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              '',
              '```text', excerpt[:8500], '```',
              '',
              'No proof or model result is claimed. The branch remains gated; the retained workflow artifact contains the first executable blocker.'
          ])
          repo = os.environ['GITHUB_REPOSITORY']
          def gh(args, payload=None):
              return subprocess.run(['gh','api',*args], input=payload, text=True, stdout=subprocess.PIPE, check=True, env=os.environ).stdout
          comments = json.loads(gh([f'repos/{repo}/issues/4/comments?per_page=100']))
          existing = next((c for c in comments if marker in c.get('body','')), None)
          payload = json.dumps({'body': body})
          if existing:
              gh(['--method','PATCH',f"repos/{repo}/issues/comments/{existing['id']}",'--input','-'], payload)
          else:
              gh(['--method','POST',f'repos/{repo}/issues/4/comments','--input','-'], payload)
          PY
