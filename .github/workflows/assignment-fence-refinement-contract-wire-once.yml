name: assignment-fence-refinement-contract-wire-once

on:
  push:
    branches:
      - bigoracle/assignment-fence-proof-v4
    paths:
      - ".github/workflows/assignment-fence-refinement-contract-wire-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bigoracle/assignment-fence-proof-v4
          fetch-depth: 0
      - name: Require refinement fairness everywhere and guard its workflows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          line = '          python3 formal/mode_refinement_fairness_contract_test.py\n'
          for name, anchor in (
              (
                  '.github/workflows/mode-refinement-formal.yml',
                  '          python3 formal/mode_refinement_static_check_test.py\n',
              ),
              (
                  '.github/workflows/assignment-fence-complete-formal-gate.yml',
                  '          python3 formal/mode_refinement_static_check_test.py\n',
              ),
              (
                  '.github/workflows/assignment-fence-final-sweep-once.yml',
                  '          python3 formal/mode_refinement_static_check_test.py\n',
              ),
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if line not in text:
                  if text.count(anchor) != 1:
                      raise SystemExit(f'{name}: refinement fairness anchor changed')
                  text = text.replace(anchor, anchor + line)
              path.write_text(text, encoding='utf-8')

          guard = Path('formal/check_formal_task_workflows_readonly.py')
          text = guard.read_text(encoding='utf-8')
          old = '''PATTERNS = (\n    "assignment-fence*.yml",\n    "f2s*.yml",\n    "cross-branch*.yml",\n)\n'''
          new = '''PATTERNS = (\n    "assignment-fence*.yml",\n    "f2s*.yml",\n    "mode-refinement*.yml",\n    "cross-branch*.yml",\n)\n'''
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('read-only guard workflow patterns changed')
          guard.write_text(text, encoding='utf-8')

          sweep = Path('.github/workflows/assignment-fence-final-sweep-once.yml')
          text = sweep.read_text(encoding='utf-8')
          text = text.replace(
              'assignment-fence*.yml|f2s*.yml|cross-branch*.yml)',
              'assignment-fence*.yml|f2s*.yml|mode-refinement*.yml|cross-branch*.yml)',
          )
          old_grep = '''            .github/workflows/f2s*.yml \\\n            .github/workflows/cross-branch*.yml 2>/dev/null; then\n'''
          new_grep = '''            .github/workflows/f2s*.yml \\\n            .github/workflows/mode-refinement*.yml \\\n            .github/workflows/cross-branch*.yml 2>/dev/null; then\n'''
          if old_grep in text:
              text = text.replace(old_grep, new_grep)
          elif new_grep not in text:
              raise SystemExit('final sweep grep scope changed')
          sweep.write_text(text, encoding='utf-8')

          for name in (
              '.github/workflows/assignment-fence-complete-formal-gate.yml',
              '.github/workflows/assignment-fence-authoritative-gate.yml',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              old_guard = '''            .github/workflows/assignment-fence*.yml \\\n            .github/workflows/f2s*.yml \\\n            .github/workflows/cross-branch*.yml 2>/dev/null; then\n'''
              new_guard = '''            .github/workflows/assignment-fence*.yml \\\n            .github/workflows/f2s*.yml \\\n            .github/workflows/mode-refinement*.yml \\\n            .github/workflows/cross-branch*.yml 2>/dev/null; then\n'''
              if old_guard in text:
                  text = text.replace(old_guard, new_guard)
              elif new_guard not in text:
                  raise SystemExit(f'{name}: final guard scope changed')
              path.write_text(text, encoding='utf-8')

          final_guard = Path('.github/workflows/assignment-fence-final-readonly-guard.yml')
          text = final_guard.read_text(encoding='utf-8')
          trigger = '      - ".github/workflows/mode-refinement*.yml"\n'
          if trigger not in text:
              anchor = '      - ".github/workflows/f2s*.yml"\n'
              if text.count(anchor) != 1:
                  raise SystemExit('final read-only trigger anchor changed')
              text = text.replace(anchor, anchor + trigger)
          final_guard.write_text(text, encoding='utf-8')
          PY
          python3 formal/check_formal_task_workflows_readonly_test.py
          git diff --check
      - name: Commit integration and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/assignment-fence-refinement-contract-wire-once.yml
          git config user.name "mickg10 formal automation"
          git config user.email "5094033+mickg10@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: require refinement fairness in final read-only closure"
          git push origin HEAD:bigoracle/assignment-fence-proof-v4
