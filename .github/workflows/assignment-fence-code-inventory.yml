name: assignment-fence-code-inventory

on:
  pull_request:
    paths:
      - "formal/**"
      - "scheduler/**"
      - "daemon/**"
      - "services/**"
      - "client/**"
      - "unittests/**"
      - ".github/workflows/assignment-fence-code-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: assignment-fence-code-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate exact source inventory
        run: |
          set -euo pipefail
          mkdir -p /tmp/assignment-fence-code-inventory
          python3 formal/generate_assignment_fence_code_inventory.py \
            --repo . \
            --output /tmp/assignment-fence-code-inventory/ASSIGNMENT_FENCE_MODEL_TO_CODE.md \
            --json-output /tmp/assignment-fence-code-inventory/inventory.json
          cat /tmp/assignment-fence-code-inventory/ASSIGNMENT_FENCE_MODEL_TO_CODE.md
      - name: Archive inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-fence-code-inventory-${{ github.sha }}
          path: /tmp/assignment-fence-code-inventory
          if-no-files-found: error
          retention-days: 30
      - name: Publish inventory status
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path

          marker = '<!-- assignment-fence-code-inventory-status -->'
          inventory_path = Path('/tmp/assignment-fence-code-inventory/inventory.json')
          if inventory_path.exists():
              inventory = json.loads(inventory_path.read_text())
              planned = {
                  name: len(matches)
                  for name, matches in inventory['inventory'].items()
                  if name.endswith('Planned')
              }
              existing = {
                  name: len(matches)
                  for name, matches in inventory['inventory'].items()
                  if not name.endswith('Planned')
              }
              summary = '\n'.join(
                  [
                      'Existing seams:',
                      *[f'- {name}: {count} source matches' for name, count in existing.items()],
                      '',
                      'Planned-product symbol scan:',
                      *[f'- {name}: {count} source matches' for name, count in planned.items()],
                  ]
              )
              state = 'generated'
          else:
              summary = 'Inventory generation failed before JSON evidence was emitted.'
              state = 'red'
          body = '\n'.join([
              marker,
              'From: mickg10/bigoracle',
              'To: mickg10/implementer, mickg10/local-oracle',
              '',
              '## Repository-derived assignment-fence code inventory',
              '',
              f"- exact head: `{os.environ['GITHUB_SHA']}`",
              f"- workflow run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- state: **{state}**",
              '',
              '```text', summary, '```',
              '',
              'The retained artifact contains every matched file, line, and source snippet. Planned PREPARE/READY/REVOKE/pending symbols are not represented as implemented unless an actual product-source match exists.'
          ])
          repo = os.environ['GITHUB_REPOSITORY']
          def gh(arguments, payload=None):
              return subprocess.run(
                  ['gh', 'api', *arguments],
                  input=payload,
                  text=True,
                  stdout=subprocess.PIPE,
                  check=True,
                  env=os.environ,
              ).stdout
          comments = json.loads(gh([f'repos/{repo}/issues/4/comments?per_page=100']))
          old = next((item for item in comments if marker in item.get('body', '')), None)
          payload = json.dumps({'body': body})
          if old:
              gh(['--method', 'PATCH', f"repos/{repo}/issues/comments/{old['id']}", '--input', '-'], payload)
          else:
              gh(['--method', 'POST', f'repos/{repo}/issues/4/comments', '--input', '-'], payload)
          PY
