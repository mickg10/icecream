name: assignment-fence-cluster-plan-contract

on:
  pull_request:
    paths:
      - "formal/validate_cluster_run_plan.py"
      - "formal/validate_cluster_run_plan_test.py"
      - "formal/cluster-run-plan.template.json"
      - ".github/workflows/assignment-fence-cluster-plan-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Run cluster plan contract tests
        run: |
          set -euo pipefail
          python3 formal/validate_cluster_run_plan_test.py
          set +e
          python3 formal/validate_cluster_run_plan.py \
            formal/cluster-run-plan.template.json \
            --repo . \
            > /tmp/template-validation.log 2>&1
          rc=$?
          set -e
          cat /tmp/template-validation.log
          test "$rc" -ne 0
          grep -q 'cluster run plan rejected' /tmp/template-validation.log
          test -z "$(git status --porcelain --untracked-files=all)"
