name: prerequisite-formal

on:
  pull_request:
    paths:
      - "formal/**"
      - ".github/workflows/prerequisite-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerequisite-formal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  TLC_174_SHA256: "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"
  TLC_180_SHA256: "e22f8ffb4bacdea0a871f444dd94fe5fb0d8013b3388ae39e82e26f852c735d5"

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact 24-row static contract
        run: >-
          python3 formal/prerequisite_static_check_v2.py
          --manifest formal/prerequisite-formal-checks-v4.json
          --repo .
          --formal-dir formal
      - name: Static checker self-test
        run: python3 formal/prerequisite_static_check_v2_test.py
      - name: Shared runner and trace self-tests
        run: |
          python3 formal/trace_to_harness_test.py
          python3 formal/tlc_text_trace_test.py
          python3 formal/normalize_tlc_trace_test.py
          python3 formal/run_formal_checks_v4_test.py
          python3 formal/run_tlc_only_checks_v4_test.py
      - name: Checkout remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"

  tlc:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: allocator
            only: "allocator-.*"
          - group: lifecycle
            only: "lifecycle-.*"
          - group: usecs
            only: "usecs-.*"
          - group: fsession
            only: "fsession-.*"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Java and GNU time
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless time curl
      - name: Download and verify pinned TLC jars
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            -o /tmp/tla2tools-1.7.4.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          curl --fail --location --retry 4 --retry-all-errors \
            -o /tmp/tla2tools-1.8.0.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          printf '%s  %s\n' "$TLC_174_SHA256" /tmp/tla2tools-1.7.4.jar | sha256sum -c -
          printf '%s  %s\n' "$TLC_180_SHA256" /tmp/tla2tools-1.8.0.jar | sha256sum -c -
          java -version
          java -jar /tmp/tla2tools-1.7.4.jar -help > /tmp/tlc-174-help.txt 2>&1 || true
          java -jar /tmp/tla2tools-1.8.0.jar -help > /tmp/tlc-180-help.txt 2>&1 || true
      - name: Run pinned dual-TLC prerequisite group
        env:
          GROUP: ${{ matrix.group }}
          ONLY: ${{ matrix.only }}
        run: |
          set -euo pipefail
          artifacts="/tmp/prerequisites-${GROUP}"
          rm -rf "$artifacts"
          python3 formal/run_prerequisite_checks_v2.py \
            --manifest formal/prerequisite-formal-checks-v4.json \
            --repo . \
            --artifacts "$artifacts" \
            --expected-git-sha "$(git rev-parse HEAD)" \
            --stable-jar /tmp/tla2tools-1.7.4.jar \
            --stable-sha256 "$TLC_174_SHA256" \
            --differential-jar /tmp/tla2tools-1.8.0.jar \
            --differential-sha256 "$TLC_180_SHA256" \
            --only "$ONLY"
      - name: Archive formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerequisites-${{ matrix.group }}-${{ github.sha }}
          path: |
            /tmp/prerequisites-${{ matrix.group }}
            /tmp/tlc-174-help.txt
            /tmp/tlc-180-help.txt
          if-no-files-found: warn
          retention-days: 30
