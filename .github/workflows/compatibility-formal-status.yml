name: compatibility-formal-status

on:
  pull_request:
    paths:
      - "formal/**"
      - ".github/workflows/compatibility-formal.yml"
      - ".github/workflows/compatibility-formal-status.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: compatibility-formal-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - name: Wait for exact compatibility-formal run and post tracker status
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          TRACKER: "4"
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = process.env.HEAD_SHA;
            const prNumber = Number(process.env.PR_NUMBER || '0');
            const tracker = Number(process.env.TRACKER);
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const deadline = Date.now() + 120 * 60 * 1000;
            let selected = null;

            const matchesExactSource = run => {
              if (run.name !== 'compatibility-formal') return false;
              if (prNumber > 0) {
                return (run.pull_requests || []).some(pr =>
                  Number(pr.number) === prNumber
                  && (!pr.head || !pr.head.sha || pr.head.sha === headSha)
                );
              }
              return run.head_sha === headSha;
            };

            while (Date.now() < deadline) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, per_page: 100 }
              );
              const candidates = runs
                .filter(matchesExactSource)
                .sort((a, b) => b.id - a.id);
              if (candidates.length > 0) {
                selected = candidates[0];
                if (selected.status === 'completed') break;
              }
              await sleep(15000);
            }

            if (!selected) {
              core.setFailed(
                `No compatibility-formal run appeared for exact source ${headSha}`
              );
              return;
            }
            if (selected.status !== 'completed') {
              core.setFailed(
                `compatibility-formal run ${selected.id} did not complete before the absolute reporter deadline`
              );
              return;
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: selected.id, per_page: 100 }
            );
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: selected.id, per_page: 100 }
            );

            const expectedArtifacts = [
              `compatibility-fixed-${headSha}`,
              `compatibility-witness-a-${headSha}`,
              `compatibility-witness-b-${headSha}`,
              `compatibility-mutants-${headSha}`,
            ];
            const byName = new Map(artifacts.map(a => [a.name, a]));
            const missingArtifacts = expectedArtifacts.filter(name => {
              const artifact = byName.get(name);
              return !artifact || artifact.expired;
            });

            const jobLines = jobs
              .sort((a, b) => a.id - b.id)
              .map(job => `- ${job.name}: ${job.conclusion || job.status}`);
            const artifactLines = artifacts.length
              ? artifacts
                  .sort((a, b) => a.id - b.id)
                  .map(a =>
                    `- ${a.name} (artifact id ${a.id}, expired=${a.expired}, digest=${a.digest || 'unavailable'})`
                  )
              : ['- NONE'];

            const marker = '<!-- compatibility-formal-status -->';
            const body = [
              marker,
              'From: mickg10/local-oracle',
              'To: mickg10/bigoracle, mickg10/implementer',
              '',
              '## Automated compatibility-formal status',
              '',
              `Exact source head: \`${headSha}\``,
              `Workflow run: \`${selected.id}\``,
              `Workflow metadata head: \`${selected.head_sha}\``,
              `Workflow conclusion: **${selected.conclusion || selected.status}**`,
              '',
              '### Jobs',
              ...jobLines,
              '',
              '### Retained artifacts',
              ...artifactLines,
              '',
              `Expected exact-head artifacts missing/expired: ${missingArtifacts.length ? missingArtifacts.join(', ') : 'NONE'}`,
              '',
              'This comment reports process/job conclusions and exact-source artifact identity only. It does not turn a missing artifact, skipped job, or failed matrix row into acceptance.'
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: tracker, per_page: 100 }
            );
            const prior = comments
              .filter(comment => comment.body && comment.body.includes(marker))
              .sort((a, b) => b.id - a.id)[0];
            if (prior) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: prior.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: tracker,
                body
              });
            }

            if (selected.conclusion !== 'success') {
              core.setFailed(
                `compatibility-formal run ${selected.id} concluded ${selected.conclusion}`
              );
            }
            if (missingArtifacts.length) {
              core.setFailed(
                `compatibility-formal run ${selected.id} lacks exact-source artifacts: ${missingArtifacts.join(', ')}`
              );
            }
