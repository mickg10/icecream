name: assignment-fence-refinement-finiteness-fix-once

on:
  push:
    branches:
      - bigoracle/assignment-fence-proof-v4
    paths:
      - ".github/workflows/assignment-fence-refinement-finiteness-fix-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bigoracle/assignment-fence-proof-v4
          fetch-depth: 0
      - name: Saturate rejected-claim diagnostic count
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('formal/AssignmentFenceModeRefinement.tla')
          text = path.read_text(encoding='utf-8')
          marker = 'CapInc(n) == IF n < MaxPending THEN n + 1 ELSE n'
          if marker not in text:
              anchor = '''AbstractStates ==\n    {"Idle", "Awaiting", "Authorized", "Revoked",\n     "Started", "Terminal", "Released"}\n\n'''
              replacement = anchor + marker + '\n\n'
              if text.count(anchor) != 1:
                  raise SystemExit('refinement finite-observer anchor changed')
              text = text.replace(anchor, replacement)
          text = text.replace('rejectedClaims + 1', 'CapInc(rejectedClaims)')
          text = text.replace(
              '/\\ rejectedClaims \\in Nat',
              '/\\ rejectedClaims \\in 0..MaxPending',
          )
          if 'rejectedClaims + 1' in text:
              raise SystemExit('unbounded rejectedClaims increment remains')
          if '/\\ rejectedClaims \\in Nat' in text:
              raise SystemExit('unbounded rejectedClaims type remains')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit finite observer and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/assignment-fence-refinement-finiteness-fix-once.yml
          git config user.name "mickg10 formal automation"
          git config user.email "5094033+mickg10@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "formal: saturate refinement reject diagnostics"
          git push origin HEAD:bigoracle/assignment-fence-proof-v4
