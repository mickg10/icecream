name: assignment-fence-mode-refinement-join-fix-once

on:
  push:
    branches:
      - bigoracle/assignment-fence-proof-v4
    paths:
      - ".github/workflows/assignment-fence-mode-refinement-join-fix-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bigoracle/assignment-fence-proof-v4
          fetch-depth: 0
      - name: Add refinement preflight, execution, and verdict fields
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          complete = Path('.github/workflows/assignment-fence-complete-formal-gate.yml')
          text = complete.read_text(encoding='utf-8')

          preflight_line = '          python3 formal/mode_refinement_static_check.py \\\n            --manifest formal/mode-refinement-checks-v1.json \\\n            --repo . \\\n            --formal-dir formal\n'
          if preflight_line not in text:
              anchor = '          python3 formal/f2s_quotient_static_check_test.py\n'
              insertion = anchor + preflight_line + '''          python3 formal/mode_refinement_static_check_test.py\n          python3 formal/run_mode_refinement_checks_test.py\n'''
              if text.count(anchor) != 1:
                  raise SystemExit('complete gate refinement-preflight anchor changed')
              text = text.replace(anchor, insertion)

          execution_name = '      - name: Execute strict/pipelined refinement matrix\n'
          if execution_name not in text:
              anchor = '      - name: Execute proof-bearing ownership/network/mode matrix\n'
              step = '''      - name: Execute strict/pipelined refinement matrix\n        id: refinement\n        run: |\n          set -euo pipefail\n          root=/tmp/assignment-fence-complete/refinement\n          mkdir -p "$root"\n          command=(\n            python3 formal/run_mode_refinement_checks.py\n            --repo .\n            --manifest formal/mode-refinement-checks-v1.json\n            --artifacts "$root/artifacts"\n            --expected-git-sha "$(git rev-parse HEAD)"\n            --stable-jar /tmp/tla2tools-1.7.4.jar\n            --stable-sha256 "$TLC_174_SHA256"\n            --differential-jar /tmp/tla2tools-1.8.0.jar\n            --differential-sha256 "$TLC_180_SHA256"\n          )\n          printf '%q ' "${command[@]}" > "$root/command.txt"\n          printf '\\n' >> "$root/command.txt"\n          set +e\n          /usr/bin/time -v -o "$root/time.txt" \\\n            "${command[@]}" > "$root/runner.log" 2>&1\n          rc=$?\n          set -e\n          printf '%s\\n' "$rc" > "$root/exit.txt"\n          cat "$root/runner.log"\n          cat "$root/time.txt"\n          test "$rc" -eq 0\n'''
              if text.count(anchor) != 1:
                  raise SystemExit('complete gate focused-execution anchor changed')
              text = text.replace(anchor, step + anchor)

          result_anchor = '''              'quotient_exit': read_exit('quotient'),\n              'focused_exit': read_exit('focused'),\n'''
          result_replacement = '''              'quotient_exit': read_exit('quotient'),\n              'refinement_exit': read_exit('refinement'),\n              'focused_exit': read_exit('focused'),\n'''
          if result_anchor in text:
              text = text.replace(result_anchor, result_replacement)
          elif result_replacement not in text:
              raise SystemExit('complete result exit anchor changed')

          hash_anchor = '''              'quotient_log_sha256': file_hash(root / 'quotient' / 'runner.log'),\n              'focused_log_sha256': file_hash(root / 'focused' / 'runner.log'),\n'''
          hash_replacement = '''              'quotient_log_sha256': file_hash(root / 'quotient' / 'runner.log'),\n              'refinement_log_sha256': file_hash(root / 'refinement' / 'runner.log'),\n              'focused_log_sha256': file_hash(root / 'focused' / 'runner.log'),\n'''
          if hash_anchor in text:
              text = text.replace(hash_anchor, hash_replacement)
          elif hash_replacement not in text:
              raise SystemExit('complete result log-hash anchor changed')

          verdict_anchor = '''              if document['quotient_exit'] == '0'\n              and document['focused_exit'] == '0'\n'''
          verdict_replacement = '''              if document['quotient_exit'] == '0'\n              and document['refinement_exit'] == '0'\n              and document['focused_exit'] == '0'\n'''
          if verdict_anchor in text:
              text = text.replace(verdict_anchor, verdict_replacement)
          elif verdict_replacement not in text:
              raise SystemExit('complete result verdict anchor changed')

          loop_anchor = "          for name in ('quotient', 'focused'):\n"
          loop_replacement = "          for name in ('quotient', 'refinement', 'focused'):\n"
          if loop_anchor in text:
              text = text.replace(loop_anchor, loop_replacement)
          elif loop_replacement not in text:
              raise SystemExit('complete publisher log-loop anchor changed')

          publish_anchor = '''              f"- quotient runner exit: `{result.get('quotient_exit')}`",\n              f"- proof-bearing runner exit: `{result.get('focused_exit')}`",\n'''
          publish_replacement = '''              f"- quotient runner exit: `{result.get('quotient_exit')}`",\n              f"- refinement runner exit: `{result.get('refinement_exit')}`",\n              f"- proof-bearing runner exit: `{result.get('focused_exit')}`",\n'''
          if publish_anchor in text:
              text = text.replace(publish_anchor, publish_replacement)
          elif publish_replacement not in text:
              raise SystemExit('complete publisher exit anchor changed')

          text = text.replace(
              'all support contracts; lockstep quotient checking; both pinned TLC distributions',
              'all support contracts; lockstep quotient checking; strict/pipelined stuttering refinement; both pinned TLC distributions',
          )
          complete.write_text(text, encoding='utf-8')

          sweep = Path('.github/workflows/assignment-fence-final-sweep-once.yml')
          sweep_text = sweep.read_text(encoding='utf-8')
          source_entry = "              Path('formal/AssignmentFenceModeRefinement.tla'),\n"
          manifest_entry = "              Path('formal/mode-refinement-checks-v1.json'),\n"
          if source_entry not in sweep_text:
              anchor = "              Path('formal/AssignmentFenceAdmissionModes.tla'),\n"
              if sweep_text.count(anchor) != 1:
                  raise SystemExit('final sweep refinement source anchor changed')
              sweep_text = sweep_text.replace(anchor, anchor + source_entry)
          if manifest_entry not in sweep_text:
              anchor = "              Path('formal/f2s-quotient-checks-v1.json'),\n"
              if sweep_text.count(anchor) != 1:
                  raise SystemExit('final sweep refinement manifest anchor changed')
              sweep_text = sweep_text.replace(anchor, anchor + manifest_entry)
          static_line = '          python3 formal/mode_refinement_static_check.py \\\n            --manifest formal/mode-refinement-checks-v1.json \\\n            --repo . \\\n            --formal-dir formal\n'
          if static_line not in sweep_text:
              anchor = '          python3 formal/f2s_quotient_static_check_test.py\n'
              insertion = anchor + static_line + '''          python3 formal/mode_refinement_static_check_test.py\n          python3 formal/run_mode_refinement_checks_test.py\n'''
              if sweep_text.count(anchor) != 1:
                  raise SystemExit('final sweep refinement preflight anchor changed')
              sweep_text = sweep_text.replace(anchor, insertion)
          sweep.write_text(sweep_text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit same-SHA integration and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/assignment-fence-mode-refinement-join-fix-once.yml
          git config user.name "mickg10 formal automation"
          git config user.email "5094033+mickg10@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: require strict-pipelined refinement in complete verdict"
          git push origin HEAD:bigoracle/assignment-fence-proof-v4
