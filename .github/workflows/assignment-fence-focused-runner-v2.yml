name: assignment-fence-focused-runner-v2

on:
  pull_request:
    paths:
      - "formal/**"
      - ".github/workflows/assignment-fence-focused-runner-v2.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: assignment-fence-focused-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  TLC_174_SHA256: "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"
  TLC_180_SHA256: "e22f8ffb4bacdea0a871f444dd94fe5fb0d8013b3388ae39e82e26f852c735d5"

jobs:
  focused-proof-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require immutable generated closure
        run: |
          set -euo pipefail
          test ! -e .github/workflows/assignment-fence-reconcile-v2-once.yml
          python3 formal/apply_assignment_fence_network_quotient.py
          python3 formal/generate_assignment_fence_admission_modes.py
          python3 formal/generate_assignment_fence_core_proof_v2.py
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 formal/assignment_fence_network_quotient_test.py
          python3 formal/assignment_fence_proof_manifest_contract_test.py
          python3 formal/run_formal_checks_v4_test.py
          python3 formal/run_tlc_only_checks_v4_test.py
          if test -f formal/tla_primed_assignment_lint_test.py; then
            python3 formal/tla_primed_assignment_lint_test.py
          fi
      - name: Install execution prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless time curl jq libgmp10
      - name: Download and verify both pinned TLC distributions
        run: |
          set -euo pipefail
          mkdir -p /tmp/assignment-fence-focused-v2
          curl --fail --location --retry 4 --retry-all-errors \
            -o /tmp/tla2tools-1.7.4.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          curl --fail --location --retry 4 --retry-all-errors \
            -o /tmp/tla2tools-1.8.0.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          printf '%s  %s\n' "$TLC_174_SHA256" /tmp/tla2tools-1.7.4.jar | sha256sum -c -
          printf '%s  %s\n' "$TLC_180_SHA256" /tmp/tla2tools-1.8.0.jar | sha256sum -c -
          java -version > /tmp/assignment-fence-focused-v2/java-version.txt 2>&1
          sha256sum /tmp/tla2tools-1.7.4.jar /tmp/tla2tools-1.8.0.jar \
            > /tmp/assignment-fence-focused-v2/tlc-digests.txt
      - name: Resolve and verify official TLAPS 1.5.0 distribution
        run: |
          set -euo pipefail
          mkdir -p /tmp/tlaps
          release=''
          for tag in v1.5.0 1.5.0; do
            if curl --fail --location --retry 3 --retry-all-errors \
              -o /tmp/tlapm-release.json \
              "https://api.github.com/repos/tlaplus/tlapm/releases/tags/${tag}"; then
              release=$tag
              break
            fi
          done
          test -n "$release"
          python3 - <<'PY' >/tmp/tlapm-asset.env
          import json
          from pathlib import Path

          release = json.loads(Path('/tmp/tlapm-release.json').read_text())
          assets = [
              asset for asset in release.get('assets', [])
              if asset.get('name', '').lower().endswith('x86_64-linux-gnu-inst.bin')
          ]
          if len(assets) != 1:
              raise SystemExit(
                  f"expected one x86_64 Linux installer; found "
                  f"{[asset.get('name') for asset in release.get('assets', [])]}"
              )
          asset = assets[0]
          print(f"TLAPS_ASSET_URL={asset['browser_download_url']}")
          print(f"TLAPS_ASSET_NAME={asset['name']}")
          print(f"TLAPS_ASSET_DIGEST={asset.get('digest') or ''}")
          PY
          source /tmp/tlapm-asset.env
          curl --fail --location --retry 4 --retry-all-errors \
            -o /tmp/tlaps-installer.bin "$TLAPS_ASSET_URL"
          actual="sha256:$(sha256sum /tmp/tlaps-installer.bin | awk '{print $1}')"
          printf '%s\n' "$release" > /tmp/assignment-fence-focused-v2/tlaps-release-tag.txt
          printf '%s\n' "$TLAPS_ASSET_NAME" > /tmp/assignment-fence-focused-v2/tlaps-asset-name.txt
          printf '%s\n' "$TLAPS_ASSET_DIGEST" > /tmp/assignment-fence-focused-v2/tlaps-release-digest.txt
          printf '%s\n' "$actual" > /tmp/assignment-fence-focused-v2/tlaps-installer-digest.txt
          if test -n "$TLAPS_ASSET_DIGEST"; then
            test "$actual" = "$TLAPS_ASSET_DIGEST"
          fi
          chmod +x /tmp/tlaps-installer.bin
          /tmp/tlaps-installer.bin -d /tmp/tlaps \
            > /tmp/assignment-fence-focused-v2/tlaps-install.log 2>&1
          TLAPM=$(find /tmp/tlaps -type f -name tlapm -perm -111 | head -n 1)
          test -n "$TLAPM"
          backend_dir=$(find /tmp/tlaps -type f \( -name zenon -o -name z3 -o -name cvc4 -o -name cvc5 \) -printf '%h\n' | head -n 1)
          test -n "$backend_dir"
          printf '%s\n' "$TLAPM" > /tmp/assignment-fence-focused-v2/tlapm-path.txt
          printf '%s\n' "$backend_dir" > /tmp/assignment-fence-focused-v2/backend-dir.txt
          "$TLAPM" --version > /tmp/assignment-fence-focused-v2/tlapm-version.txt 2>&1 || \
          "$TLAPM" -v > /tmp/assignment-fence-focused-v2/tlapm-version.txt 2>&1 || true
      - name: Run exact generation-4 proof-bearing matrix
        run: |
          set -euo pipefail
          TLAPM=$(cat /tmp/assignment-fence-focused-v2/tlapm-path.txt)
          BACKEND_DIR=$(cat /tmp/assignment-fence-focused-v2/backend-dir.txt)
          export PATH="$BACKEND_DIR:$PATH"
          artifacts=/tmp/assignment-fence-focused-v2/artifacts
          rm -rf "$artifacts"
          command=(
            python3 formal/run_assignment_fence_focused_gate.py
            --repo .
            --manifest formal/assignment-fence-proof-checks-v1.json
            --artifacts "$artifacts"
            --expected-git-sha "$(git rev-parse HEAD)"
            --stable-jar /tmp/tla2tools-1.7.4.jar
            --stable-sha256 "$TLC_174_SHA256"
            --differential-jar /tmp/tla2tools-1.8.0.jar
            --differential-sha256 "$TLC_180_SHA256"
            --tlapm "$TLAPM"
            --backend-dir "$BACKEND_DIR"
          )
          printf '%q ' "${command[@]}" > /tmp/assignment-fence-focused-v2/command.txt
          printf '\n' >> /tmp/assignment-fence-focused-v2/command.txt
          set +e
          /usr/bin/time -v -o /tmp/assignment-fence-focused-v2/time.txt \
            "${command[@]}" \
            > /tmp/assignment-fence-focused-v2/runner.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/assignment-fence-focused-v2/exit.txt
          cat /tmp/assignment-fence-focused-v2/runner.log
          cat /tmp/assignment-fence-focused-v2/time.txt
          test "$rc" -eq 0
      - name: Archive complete proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-fence-focused-v2-${{ github.sha }}
          path: /tmp/assignment-fence-focused-v2
          if-no-files-found: error
          retention-days: 30
      - name: Publish exact focused status
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path

          marker = '<!-- assignment-fence-focused-v2-status -->'
          root = Path('/tmp/assignment-fence-focused-v2')
          log = root / 'runner.log'
          if log.exists():
              lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
              selected = [
                  line for line in lines
                  if any(token in line.lower() for token in (
                      'formal acceptance failed', 'failed', 'unproved',
                      'error:', 'states generated', 'distinct states',
                      'comparison', 'proof', 'focused runner command'
                  ))
              ]
              excerpt = '\n'.join(selected[:160]) or '\n'.join(lines[-120:])
          else:
              excerpt = 'The generation-4 runner did not start; inspect setup evidence.'
          excerpt = excerpt[:10000]
          exit_path = root / 'exit.txt'
          rc = exit_path.read_text().strip() if exit_path.exists() else 'not-started'
          body = '\n'.join([
              marker,
              'From: mickg10/bigoracle',
              'To: mickg10/local-oracle, mickg10/implementer',
              '',
              '## Focused assignment-fence v2 gate',
              '',
              f"- exact head: `{os.environ['GITHUB_SHA']}`",
              f"- workflow run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- authoritative runner exit: `{rc}`",
              '',
              '```text', excerpt, '```',
              '',
              'Acceptance requires every fixed row to exhaust nonzero state space on TLC 1.7.4 and 1.8.0, every named witness/mutant to validate its essential trace on both, stable/differential comparison agreement, positive peak RSS, and zero failed TLAPS obligations. No protocol behavior is authorized by a red or incomplete run.'
          ])
          repo = os.environ['GITHUB_REPOSITORY']
          def gh(arguments, payload=None):
              return subprocess.run(
                  ['gh', 'api', *arguments],
                  input=payload,
                  text=True,
                  stdout=subprocess.PIPE,
                  check=True,
                  env=os.environ,
              ).stdout
          comments = json.loads(gh([f'repos/{repo}/issues/4/comments?per_page=100']))
          existing = next(
              (comment for comment in comments if marker in comment.get('body', '')),
              None,
          )
          payload = json.dumps({'body': body})
          if existing:
              gh([
                  '--method', 'PATCH',
                  f"repos/{repo}/issues/comments/{existing['id']}",
                  '--input', '-'
              ], payload)
          else:
              gh([
                  '--method', 'POST',
                  f'repos/{repo}/issues/4/comments',
                  '--input', '-'
              ], payload)
          PY
