SPECIFICATION SafetySpec

CONSTANTS
  Clients = {c1, c2}
  Entries = {e1, e2}
  Generations = {g1, g2}
  Jobs = {j1, j2, j3, j4}
  Assignments = {a1, a2, a3, a4}
  Nonces = {n1, n2, n3, n4}
  Capacity = 1
  NoGeneration = NoGeneration
  NoJob = NoJob
  NoAssignment = NoAssignment
  NoNonce = NoNonce

INVARIANTS
  TypeOK
  StartedImpliesBeginCommitted
  ChargedExactlyInChargedPhase
  CapacityBound
  DoneAuthority
  CompletedIffTerminal
  LiveJobUnique
  LiveTokenUnique
  CompletedJobNotLive
  GenerationAgreement
  LocalOwnerAgreement
  SchedulerAgreement
  ClosedClean
