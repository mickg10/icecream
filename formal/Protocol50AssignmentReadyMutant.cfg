SPECIFICATION Spec

CONSTANTS
    Assignments = {a0, a1}
    Epochs = {e0, e1}
    WireIds = {w0}
    Nonces = {n0, n1}
    NoAssignment = no_assignment
    NoEpoch = no_epoch
    InitEpoch = e0
    RestartAssignment = a1
    EpochOf = [a0 |-> e0, a1 |-> e1]
    WireOf = [a0 |-> w0, a1 |-> w0]
    NonceOf = [a0 |-> n0, a1 |-> n1]
    AssignmentAt = [e0 |-> [w0 |-> a0],
                    e1 |-> [w0 |-> a1]]
    MutantAllowStrictLegacy = FALSE
    MutantPublishBeforeReady = TRUE
    MutantReleaseWithoutRevoke = FALSE
    MutantPrepareOverTombstone = FALSE

INVARIANTS
    TypeOK
    ReadyGate

CHECK_DEADLOCK FALSE
